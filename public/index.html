  storeGet: async (k) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch { return null; } },
  storeSet: async (k, v) => { localStorage.setItem(k, JSON.stringify(v)); },
  saveAndUploadBill: async ({ billData }) => ({ success: true, browserSaved: true, message: 'Saved in local storage' }),
  deleteBillFromDrive: async ({ billData }) => ({ success: true, message: 'Deleted' }),
  syncAllBills: async ({ billPayloads }) => ({ success: true, summary: { total: billPayloads.length, synced: billPayloads.length, updated: 0, failed: 0, results: [] } }),
  gmailAuthStart: async () => ({ success: true, message: 'Gmail auth requires Electron desktop app' }),
  gmailAuthExchange: async () => ({ success: false, error: 'Gmail auth requires Electron desktop app' }),
  gmailAuthStatus: async () => ({ connected: false }),
  gmailAuthDisconnect: async () => ({ success: true }),
  gmailScan: async () => ({ success: false, error: 'Gmail sync requires Electron desktop app' }),
   saveLocalPdf: async ({ billData, htmlContent }) => {
    const printWin = window.open('', '_blank', 'width=900,height=800');
    if (printWin) {
      printWin.document.open();
      printWin.document.write(htmlContent);
      printWin.document.close();
      setTimeout(() => { printWin.focus(); printWin.print(); }, 300);
      return { success: true };
    }
    return { success: false, error: 'Popup blocked' };
  },
  organizeDriveBills: async () => ({ success: true, report: { total: 0, moved: 0, alreadyInPlace: 0 } }),
  exportFile: async ({ defaultName, content, extension }) => {
    const blob = new Blob([content], { type: extension === 'json' ? 'application/json' : 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = defaultName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return { success: true };
  },
  importFile: async () => {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return resolve({ success: false, canceled: true });
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          resolve({ success: true, data, fileName: file.name });
        } catch (err) {
          resolve({ success: false, error: err.message });
        }
      };
      input.click();
    });
  },
  googleAuthStart: async () => ({ success: false, error: 'Google Drive sync is available in Electron Desktop app' }),
  googleAuthExchange: async () => ({ success: false, error: 'Google Drive sync is available in Electron Desktop app' }),
  googleAuthStatus: async () => ({ connected: false }),

  },
};

function numWords(n) {
  if (isNaN(n) || n === null || n === undefined) return 'Zero';
  n = Math.round(Number(n) || 0);
  if (n <= 0) return 'Zero';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if (n < 20)  return a[n];
  if (n < 100) return b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '');
  if (n < 1000) return a[Math.floor(n/100)]+' Hundred'+(n%100 ? ' '+numWords(n%100) : '');
  if (n < 100000) return numWords(Math.floor(n/1000))+' Thousand'+(n%1000 ? ' '+numWords(n%1000) : '');
  if (n < 10000000) return numWords(Math.floor(n/100000))+' Lakh'+(n%100000 ? ' '+numWords(n%100000) : '');
  return numWords(Math.floor(n/10000000))+' Crore'+(n%10000000 ? ' '+numWords(n%10000000) : '');
}

function calcAmount(kattu, kazhi, rate, count, countMap) {
  const k  = parseFloat(kattu) || 0;
  const kz = parseFloat(kazhi) || 0;
  const r  = parseFloat(rate)  || 0;
  if (isNaN(r) || r <= 0 || (k === 0 && kz === 0)) return 0;
  if (k === 0) return kz * r;
  if (kz === 0) return k * r;
  const countKey = (count || '').toString().trim().toLowerCase();
  const mapping  = (countMap || DEFAULT_COUNT_MAP).find(m => m.count.toLowerCase() === countKey);
  const kazhiDiv = mapping && Number(mapping.kazhi) ? Number(mapping.kazhi) : 0;
  if (!kazhiDiv) return k * r + kz * r;
  return (k * r) + (kz * (r / kazhiDiv));
}

function getEffective(items, idx, field) {
  for (let i = idx; i >= 0; i--) {
    if ((items[i][field] || '').toString().trim() !== '') return items[i][field];
  }
  return '';
}

function autoFormatCount(raw) {
  const v = (raw || '').trim();
  if (!v) return v;
  if (v.toLowerCase().endsWith('s')) return v;
  if (/^[\d/]+$/.test(v)) return v + 's';
  return v;
}

function getBillFinancials(bill) {
  const net = Number(bill.netAmount || 0);
  let totalPaid = 0;
  if (bill.payments && Array.isArray(bill.payments) && bill.payments.length > 0) {
    totalPaid = bill.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  } else if (bill.status === 'paid') {
    totalPaid = net;
  }
  const balance = Math.max(0, net - totalPaid);
  let computedStatus = 'pending';
  if (totalPaid >= net && net > 0) {
    computedStatus = 'paid';
  } else if (totalPaid > 0) {
    computedStatus = 'partial';
  }
  return { totalPaid, balance, computedStatus };
}

// ── WHATSAPP SHARE URL GENERATOR ─────────────────────────────────────────────
function getWhatsAppShareUrl(bill, phone = '', driveUrl = '') {
  const cleanPhone = (phone || '').replace(/\D/g, '');
  const phoneParam = cleanPhone.length >= 10 ? `91${cleanPhone.slice(-10)}` : '';
  const fin = getBillFinancials(bill);
  const statusStr = fin.computedStatus === 'paid' ? 'PAID ✓' : (fin.computedStatus === 'partial' ? `PARTIAL (Paid: ₹${fin.totalPaid.toLocaleString('en-IN')})` : 'PENDING');
  
  const textLines = [
    `🧾 *SRI GANAPATHI COLOURS — GST INVOICE*`,
    `━━━━━━━━━━━━━━━━━━━━━━`,
    `*Bill No:* #${bill.billNo}`,
    `*Date:* ${bill.date}`,
    `*Customer:* ${bill.customer}`,
    bill.partyGst ? `*Party GST:* ${bill.partyGst}` : '',
    `*Net Amount:* ₹${Number(bill.netAmount||0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}`,
    `*Payment Status:* ${statusStr}`,
    fin.balance > 0 ? `*Balance Due:* ₹${Number(fin.balance).toLocaleString('en-IN', { minimumFractionDigits: 2 })}` : '',
    `━━━━━━━━━━━━━━━━━━━━━━`,
    `🏦 *Bank Details for Payment:*`,
    `Bank: CSB BANK`,
    `A/c No: 003204157368195001`,
    `IFSC: CSBK0000032`,
    driveUrl || bill.driveUrl ? `\n📄 *Download PDF:* ${driveUrl || bill.driveUrl}` : '',
    `\n_Thank you for your business!_`
  ].filter(Boolean).join('\n');

  return phoneParam
    ? `https://wa.me/${phoneParam}?text=${encodeURIComponent(textLines)}`
    : `https://wa.me/?text=${encodeURIComponent(textLines)}`;
}

// ── EXPORT BILLS TO CSV (GSTR-1 COMPLIANT FORMAT) ────────────────────────────
function exportBillsToCSV(bills) {
  const headers = [
    "Sl No", "Invoice Date", "Invoice No", "Customer Name", "Customer GSTIN",
    "HSN/SAC", "Total Kattu", "Total Kazhi", "Taxable Amount (Subtotal)",
    "CGST Rate", "CGST Amount", "SGST Rate", "SGST Amount", "Round Off",
    "Invoice Net Amount", "Payment Status", "Paid Amount", "Balance Due",
    "Drive PDF Link"
  ];

  const rows = bills.map((b, i) => {
    const fin = getBillFinancials(b);
    const totalKattu = (b.items||[]).reduce((s,it)=>s+Number(it.kattu||0),0);
    const totalKazhi = (b.items||[]).reduce((s,it)=>s+Number(it.kazhi||0),0);
    return [
      i + 1,
      `"${b.date || ''}"`,
      `"${b.billNo || ''}"`,
      `"${(b.customer || '').replace(/"/g, '""')}"`,
      `"${(b.partyGst || '').replace(/"/g, '""')}"`,
      '"9988"',
      totalKattu,
      totalKazhi,
      fmt(b.subtotal),
      "2.50%",
      fmt(b.cgst),
      "2.50%",
      fmt(b.sgst),
      fmt(b.netAmount - (b.subtotal + b.cgst + b.sgst)),
      fmt(b.netAmount),
      `"${fin.computedStatus.toUpperCase()}"`,
      fmt(fin.totalPaid),
      fmt(fin.balance),
      `"${b.driveUrl || ''}"`
    ].join(',');
  });

  return "\uFEFF" + [headers.join(','), ...rows].join('\r\n');
}

// ── AUTOCOMPLETE MODAL / DROPDOWN ────────────────────────────────────────────
function AutocompleteInput({ value = '', options = [], onChange, onSelect, placeholder, style, renderItem }) {
  const [open, setOpen] = useState(false);
  const [filtered, setFiltered] = useState([]);
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleChange = (val) => {
    onChange(val);
    const s = String(val || '').trim();
    if (!s) { setFiltered([]); setOpen(false); return; }
    const opts = Array.isArray(options) ? options : [];
    const f = opts.filter(opt => {
      const text = typeof opt === 'string' ? opt : (opt?.name || opt?.count || '');
      return text.toLowerCase().includes(s.toLowerCase());
    }).slice(0, 8);
    setFiltered(f);
    setOpen(f.length > 0);
  };

  const safeVal = value === undefined || value === null ? '' : String(value);

  return (
    <div ref={ref} style={{ position:'relative', width:'100%' }}>
      <input
        style={style}
        value={safeVal}
        onChange={e => handleChange(e.target.value)}
        onFocus={() => {
          if (safeVal.trim() && filtered.length > 0) setOpen(true);
        }}
        placeholder={placeholder}
        autoComplete="off"
      />
      {open && (
        <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:200, background:'#121422', border:'1px solid rgba(59,130,246,0.5)', borderRadius:8, boxShadow:'0 10px 30px rgba(0,0,0,0.8)', marginTop:4, maxHeight:220, overflowY:'auto' }}>
          {filtered.map((item, i) => (
            <div key={i} onMouseDown={()=>{ onSelect(item); setOpen(false); setFiltered([]); }}
              style={{ padding:'9px 12px', cursor:'pointer', borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.05)':'none', transition:'background 0.1s' }}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(59,130,246,0.2)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              {renderItem ? renderItem(item) : (
                <div style={{ fontSize:13, color:'#e8f0ff', fontWeight:600 }}>{typeof item === 'string' ? item : (item?.name || item?.count || '')}</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

            <div style={{ fontSize:10, color:C.textMuted, letterSpacing:1.5, textTransform:'uppercase', fontWeight:700 }}>Drive Vault Backup</div>
            <div style={{ fontSize:20, fontWeight:800, color:C.drive, marginTop:4 }}>{syncedCount} / {monthBills.length}</div>
            <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>{syncedCount === monthBills.length ? '✅ 100% Backed Up' : '⚠️ Pending Auto-Sync'}</div>
          </div>
        </div>

        {/* Customer Breakdown Table */}
        <div style={{ background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:12, padding:16, marginBottom:20 }}>
          <div style={{ fontSize:13, fontWeight:700, color:'#fff', marginBottom:12 }}>Customer-Wise Billing & Receivables ({monthName})</div>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:11.5 }}>
            <thead>
              <tr style={{ background:'rgba(255,255,255,0.04)', color:C.textMuted }}>
                <th style={{ ...S.th, textAlign:'left' }}>Customer Name</th>
                <th style={S.th}>Bills Count</th>
                <th style={{ ...S.th, textAlign:'right' }}>Total Billed (₹)</th>
                <th style={{ ...S.th, textAlign:'right' }}>Outstanding (₹)</th>
                <th style={{ ...S.th, textAlign:'right' }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {Object.values(customerMap).map(c => (
                <tr key={c.name} style={{ borderBottom:'1px solid rgba(255,255,255,0.05)' }}>
                  <td style={{ ...S.td, fontWeight:700, color:'#fff' }}>{c.name}</td>
                  <td style={{ ...S.td, textAlign:'center' }}>{c.count}</td>
                  <td style={{ ...S.td, textAlign:'right', fontWeight:700, color:C.gold }}>₹{c.total.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
                  <td style={{ ...S.td, textAlign:'right', fontWeight:700, color: c.pending > 0 ? C.red : C.green }}>₹{c.pending.toLocaleString('en-IN', {minimumFractionDigits:2})}</td>
                  <td style={{ ...S.td, textAlign:'right' }}>
                    <span style={S.badge(c.pending === 0 ? 'green' : 'orange')}>
                      {c.pending === 0 ? '✓ Paid' : 'Pending'}
                    </span>
                  </td>
                </tr>
              ))}
              {Object.keys(customerMap).length === 0 && (
                <tr><td colSpan={5} style={{ ...S.td, textAlign:'center', color:C.textMuted, padding:20 }}>No bills found for {monthName}</td></tr>
              )}
            </tbody>
          </table>
        </div>

        {/* Action Buttons */}
        <div style={{ display:'flex', gap:10, justifyContent:'flex-end', alignItems:'center', borderTop:'1px solid rgba(255,255,255,0.08)', paddingTop:16 }}>
          {downloadMsg && <span style={{ fontSize:12, color:C.green, fontWeight:700, marginRight:'auto' }}>{downloadMsg}</span>}
          <button style={{ ...S.btn('primary'), padding:'9px 18px', fontSize:12 }} onClick={handleDownloadReport}>
            📥 Download Audit Report (.txt)
          </button>
          <button
            style={{ ...S.btn('drive'), padding:'9px 18px', fontSize:12 }}
            onClick={()=>api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9?usp=drive_link')}>
            ☁ Open Drive Master Vault ↗
          </button>
          <button style={{ ...S.btn(), padding:'9px 16px', fontSize:12 }} onClick={onClose}>Done</button>
        </div>

      </div>
    </div>
  );
}

// ── NEW & EDIT BILL FORM ──────────────────────────────────────────────────────
function NewBillForm({ customers, bills, countMap, onSave, editBill, onCancelEdit, driveConnected, company }) {
  const nextNo = editBill ? editBill.billNo : bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
  const [form, setForm]           = useState(editBill || { billNo:nextNo, date:today(), customer:'', partyGst:'', items:[{id:uid(),delNo:'',poNo:'',variety:'',count:'',kattu:'',kazhi:'',rate:'',amount:''}], status:'pending', payments:[] });
  const [saving, setSaving]       = useState(false);
  const [uploadStatus, setUpload] = useState(null); // null | 'uploading' | 'done' | 'error'
  const [driveUrl, setDriveUrl]   = useState(editBill?.driveUrl || null);
  const [errMsg, setErrMsg]       = useState('');
  const [billNoEdit, setBillNoEdit] = useState(false);

  useEffect(() => {
    if (editBill) {
      setForm(editBill);
      setDriveUrl(editBill.driveUrl || null);
    }
  }, [editBill]);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const handleCustomerSelect = (c) => setForm(f => ({ ...f, customer: c.name, partyGst: c.gst }));

  const setItem = (idx, k, v) => {
    const items = [...form.items];
    items[idx] = { ...items[idx], [k]: v };
    if (['kattu','kazhi','rate','count'].includes(k)) {
      const it = items[idx];
      const amt = calcAmount(it.kattu, it.kazhi, it.rate, it.count, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : '';
    }
    setForm(f => ({ ...f, items }));
  };

  const handleCountBlur = (idx) => {
    const it = form.items[idx];
    const formatted = autoFormatCount(it.count);
    if (formatted !== it.count) {
      const items = [...form.items];
      items[idx] = { ...items[idx], count: formatted };
      const amt = calcAmount(items[idx].kattu, items[idx].kazhi, items[idx].rate, formatted, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : items[idx].amount;
      setForm(f => ({ ...f, items }));
    }
  };

  const addRow    = () => setForm(f => ({ ...f, items: [...f.items, { id:uid(), delNo:'', poNo:'', variety:'', count:'', kattu:'', kazhi:'', rate:'', amount:'' }] }));
  const removeRow = (idx) => { if (form.items.length === 1) return; setForm(f => ({ ...f, items: f.items.filter((_,i)=>i!==idx) })); };
  const cloneRow  = (idx) => {
    const it = form.items[idx];
    setForm(f => ({ ...f, items: [...f.items, { ...it, id:uid() }] }));
  };

  const sub     = form.items.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
  const cgst    = sub * 0.025;
  const sgst    = sub * 0.025;
  const rawNet  = sub + cgst + sgst;
  const net     = isNaN(rawNet) ? 0 : Math.round(rawNet);
  const rounded = isNaN(net - rawNet) ? 0 : (net - rawNet);

  const buildBillObject = () => ({
    ...form,
    billNo:    Number(form.billNo),
    subtotal:  sub,
    cgst,
    sgst,
    netAmount: net,
    id:        form.id || uid(),
    updatedAt: new Date().toISOString(),
  });

  const handleSave = async () => {
    if (!form.customer.trim()) { alert('Customer name required!'); return; }
    setSaving(true);
    setUpload('uploading');
    setErrMsg('');

    const bill = buildBillObject();
    if (!form.id) {
      setForm(f => ({ ...f, id: bill.id }));
    }
    await onSave(bill);

    const htmlContent = generateBillHTML(bill, company);

    if (driveConnected) {
      const result = await api.saveAndUploadBill({ billData: bill, htmlContent });
      if (result.success) {
        const billWithUrl = {
          ...bill,
          driveUrl: result.driveUrl,
          driveFileId: result.fileId,
          vaultFiles: result.vaultFiles,
          monthFolder: result.monthFolderName,
          monthFolderId: result.monthFolderId
        };
        await onSave(billWithUrl);
        setDriveUrl(result.driveUrl);
        setUpload('done');
      } else {
        setErrMsg(result.error || 'Drive upload failed');
        setUpload('error');
      }
    } else {
      setUpload('done');
    }

    setSaving(false);
  };

  const handleSaveLocalPdf = async () => {
    if (!form.customer.trim()) { alert('Customer name required!'); return; }
    const bill = buildBillObject();
    const htmlContent = generateBillHTML(bill, company);
    const res = await api.saveLocalPdf({ billData: bill, htmlContent });
    if (res.success) {
      alert('✅ PDF saved successfully!');
    }
  };

  const handlePrint = () => {
    const pb = buildBillObject();
    api.printBill(generateBillHTML(pb, company));
  };

  const handleWhatsApp = () => {
    const pb = buildBillObject();
    const matched = customers.find(c => c.name.toLowerCase() === form.customer.toLowerCase());
    const url = getWhatsAppShareUrl(pb, matched?.phone || '', driveUrl);
    api.openExternal(url);
  };

  const handleReset = () => {
    if (confirm('Clear form and start new bill?')) {
      if (onCancelEdit) onCancelEdit();
      const nNo = bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
      setForm({ billNo:nNo, date:today(), customer:'', partyGst:'', items:[{id:uid(),delNo:'',poNo:'',variety:'',count:'',kattu:'',kazhi:'',rate:'',amount:''}], status:'pending', payments:[] });
      setDriveUrl(null);
      setUpload(null);
    }
  };

  const bi  = { background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:6, padding:'7px 8px', color:'#f9fafb', fontSize:12, width:'100%', fontFamily:'inherit', outline:'none', boxSizing:'border-box', textAlign:'center', fontVariantNumeric:'tabular-nums' };
  const biL = { ...bi, textAlign:'left' };

  return (
    <div className="fade-in">
      {/* Header bar */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, flexWrap:'wrap', gap:12 }}>
        <div>
          <div style={{ fontSize:10, letterSpacing:3, textTransform:'uppercase', color:C.blue, fontWeight:700 }}>{company.name}</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.text, display:'flex', alignItems:'center', gap:10 }}>
            {editBill ? '✏️ Edit Bill' : '➕ New Bill'} — <span style={{ color:C.blue }}>#{form.billNo}</span>
            {editBill && (
              <span style={{ fontSize:12, background:'rgba(245,158,11,0.15)', color:C.orange, border:'1px solid rgba(245,158,11,0.35)', borderRadius:6, padding:'2px 8px' }}>
                Editing Mode
              </span>
            )}
          </div>
        </div>

        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
          {editBill && (
            <button style={{ ...S.btn('danger'), padding:'8px 14px' }} onClick={onCancelEdit}>✕ Cancel Edit</button>
          )}
          {uploadStatus === 'uploading' && (
            <span style={{ fontSize:11, color:C.drive, display:'flex', alignItems:'center', gap:5 }}>
              <span style={{ display:'inline-block', animation:'spin 1s linear infinite' }}>⟳</span>
              PDF Sync to Drive...
            </span>
          )}
          {uploadStatus === 'done' && (
            <span onClick={()=>driveUrl ? api.openExternal(driveUrl) : null}
              style={{ fontSize:11, color:C.green, cursor:driveUrl?'pointer':'default', background:'rgba(16,185,129,0.12)', border:'1px solid rgba(16,185,129,0.35)', borderRadius:6, padding:'5px 10px' }}>
              {driveUrl ? '✅ PDF in Drive → Open ↗' : '✅ Bill Saved!'}
            </span>
          )}
          {uploadStatus === 'error' && (
            <span style={{ fontSize:11, color:C.amber, background:'rgba(245,158,11,0.12)', border:'1px solid rgba(245,158,11,0.35)', borderRadius:6, padding:'5px 10px', maxWidth:320, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }} title={errMsg}>
              ⚠ {errMsg || 'Saved Locally (Drive sync pending)'}
            </span>
          )}

          <button style={S.btn('whatsapp')} onClick={handleWhatsApp}>💬 WhatsApp</button>
          <button style={S.btn('blue')} onClick={handlePrint}>🖨 Print</button>
          <button style={S.btn()} onClick={handleSaveLocalPdf}>📥 Local PDF</button>
          <button style={S.btn('primary')} onClick={handleSave} disabled={saving}>
            {saving ? '⟳ Saving...' : '💾 Save Bill'}
          </button>
          <button style={{ ...S.btn(), padding:'8px 12px' }} onClick={handleReset} title="Start fresh bill">➕ Reset</button>
        </div>
      </div>

      {/* Bill form layout */}
      <div style={{ background:'#111827', border:'1px solid rgba(255,255,255,0.1)', borderRadius:12, boxShadow:'0 8px 32px rgba(0,0,0,0.35)', overflow:'hidden' }}>
        {/* Header section */}
        <div style={{ display:'flex', borderBottom:'1px solid rgba(255,255,255,0.08)', flexWrap:'wrap' }}>
          <div style={{ flex:'1 1 60%', padding:'18px 24px', borderRight:'1px solid rgba(255,255,255,0.08)' }}>
            <div style={{ fontSize:20, fontWeight:800, color:'#f9fafb', letterSpacing:0.5, marginBottom:4 }}>{company.name}</div>
            <div style={{ fontSize:11.5, color:'#94a3b8' }}>{company.address}</div>
            <div style={{ fontSize:11.5, color:'#94a3b8' }}>{company.contact}</div>
            <div style={{ fontSize:11.5, color:'#38bdf8', marginTop:4, fontWeight:600 }}>GSTIN : {company.gstin} &nbsp;&nbsp; HSN / SAC : {company.hsn}</div>
          </div>
          <div style={{ flex:'1 1 35%', padding:'16px 20px', minWidth:260 }}>
            <div style={{ textAlign:'center', background:'rgba(56,189,248,0.12)', border:'1px solid rgba(56,189,248,0.3)', color:'#38bdf8', fontWeight:700, fontSize:11, letterSpacing:2, padding:'6px 8px', borderRadius:6, marginBottom:12 }}>GST TAX INVOICE</div>
            <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'8px 12px', alignItems:'center' }}>
              <span style={{ fontSize:11, color:'#94a3b8', fontWeight:600 }}>Bill No. :</span>
              {billNoEdit ? (
                <input style={{ ...bi, fontWeight:800, color:'#38bdf8', fontSize:15 }} type="number" value={form.billNo}
                  onChange={e=>set('billNo',e.target.value)} onBlur={()=>setBillNoEdit(false)} autoFocus />
              ) : (
                <div style={{ ...bi, fontWeight:800, color:'#38bdf8', fontSize:15, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }} onClick={()=>setBillNoEdit(true)}>
                  #{form.billNo}<span style={{ fontSize:10, color:'#94a3b8' }}>✎</span>
                </div>
              )}
              <span style={{ fontSize:11, color:'#94a3b8', fontWeight:600 }}>Date :</span>
              <input style={bi} type="date" value={form.date} onChange={e=>set('date',e.target.value)} />
            </div>
          </div>
        </div>

        <div style={{ textAlign:'center', background:'rgba(255,255,255,0.03)', color:'#cbd5e1', fontWeight:700, letterSpacing:2, fontSize:11.5, padding:'7px', borderBottom:'1px solid rgba(255,255,255,0.08)' }}>{company.title}</div>

        {/* Customer select */}
        <div style={{ padding:'14px 24px', borderBottom:'1px solid rgba(255,255,255,0.08)' }}>
          <div style={{ display:'grid', gridTemplateColumns:'36px 1fr 90px 1fr', gap:'0 12px', alignItems:'center' }}>
            <span style={{ fontSize:12, color:'#94a3b8', fontWeight:600 }}>M/s.</span>
            <AutocompleteInput
              value={form.customer}
              options={customers}
              onChange={v=>set('customer',v)}
              onSelect={handleCustomerSelect}
              placeholder="Search or type customer name..."
              style={biL}
              renderItem={(c) => (
                <div>
                  <div style={{ fontSize:13, color:'#f9fafb', fontWeight:600 }}>{c.name}</div>
                  <div style={{ fontSize:10, color:'#94a3b8' }}>GST: {c.gst || 'None'}</div>
                </div>
              )}
            />
            <span style={{ fontSize:12, color:'#94a3b8', fontWeight:600, textAlign:'right' }}>Party GST</span>
            <input style={biL} value={form.partyGst} onChange={e=>set('partyGst',e.target.value)} placeholder="Auto-filled or enter GST" />
          </div>
        </div>

        {/* Quick yarn variety chips */}
        <div style={{ padding:'8px 24px', background:'rgba(0,0,0,0.2)', borderBottom:'1px solid rgba(255,255,255,0.08)', display:'flex', gap:8, overflowX:'auto', alignItems:'center' }}>
          <span style={{ fontSize:10, color:'#38bdf8', fontWeight:700, textTransform:'uppercase', letterSpacing:1, whiteSpace:'nowrap' }}>Common Counts:</span>
          {COMMON_COUNTS.slice(0, 7).map(c => (
            <span key={c} onClick={()=>{
              const lastIdx = form.items.length - 1;
              setItem(lastIdx, 'count', c);
            }} style={{ fontSize:10, background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:4, padding:'3px 10px', color:'#cbd5e1', cursor:'pointer', whiteSpace:'nowrap', transition:'all 0.15s' }}>
              {c}
            </span>
          ))}
        </div>

        {/* Items Table */}
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
            <thead>
              <tr style={{ background:'#1e293b' }}>
                {[['Sl','4%'],['Del. No.','10%'],['PO.No.','9%'],['Variety','22%'],['Count','9%'],['Kattu','7%'],['Kazhi','7%'],['Rate','9%'],['Amount','12%'],['','7%']].map(([h,w]) => (
                  <th key={h} style={{ padding:'10px 6px', color:'#e2e8f0', textAlign:'center', fontSize:10, letterSpacing:1, fontWeight:700, border:'1px solid rgba(255,255,255,0.08)', width:w, textTransform:'uppercase' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {form.items.map((it, idx) => {
                const effDel       = getEffective(form.items, idx, 'delNo');
                const effPo        = getEffective(form.items, idx, 'poNo');
                const matchedCount = countMap.find(c => c.count.toLowerCase() === (it.count||'').toLowerCase());
                return (
                  <tr key={it.id} style={{ background:idx%2===0?'#111827':'rgba(255,255,255,0.02)' }}>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'5px 4px', textAlign:'center', color:'#94a3b8', fontSize:11 }}>{idx+1}</td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px', position:'relative' }}>
                      <input style={{ ...bi, padding:'6px 6px' }} value={it.delNo || ''} onChange={e=>setItem(idx,'delNo',e.target.value)} />
                      {!it.delNo && idx>0 && effDel && <div style={{ position:'absolute', top:'50%', left:8, transform:'translateY(-50%)', fontSize:11, color:'rgba(148,163,184,0.5)', pointerEvents:'none', fontStyle:'italic' }}>{effDel}</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px', position:'relative' }}>
                      <input style={{ ...bi, padding:'6px 6px' }} value={it.poNo || ''} onChange={e=>setItem(idx,'poNo',e.target.value)} />
                      {!it.poNo && idx>0 && effPo && <div style={{ position:'absolute', top:'50%', left:8, transform:'translateY(-50%)', fontSize:11, color:'rgba(148,163,184,0.5)', pointerEvents:'none', fontStyle:'italic' }}>{effPo}</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px' }}>
                      <AutocompleteInput
                        value={it.variety || ''}
                        options={COMMON_VARIETIES}
                        onChange={v=>setItem(idx,'variety',v)}
                        onSelect={v=>setItem(idx,'variety',v)}
                        placeholder="Cotton, Viscose..."
                        style={{ ...bi, textAlign:'left', padding:'6px 8px' }}
                      />
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px' }}>
                      <input style={{ ...bi, padding:'6px 6px', borderColor:matchedCount?'rgba(16,185,129,0.5)':'rgba(255,255,255,0.1)' }}
                        value={it.count || ''} onChange={e=>setItem(idx,'count',e.target.value)} onBlur={()=>handleCountBlur(idx)} placeholder="17s" />
                      {matchedCount
                        ? <div style={{ fontSize:9, color:'#34d399', textAlign:'center', marginTop:1 }}>={matchedCount.kazhi} kzh/ktt</div>
                        : it.count && <div style={{ fontSize:9, color:'#f59e0b', textAlign:'center', marginTop:1 }}>no map</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px' }}>
                      <input style={{ ...bi, padding:'6px 6px' }} value={it.kattu || ''} onChange={e=>setItem(idx,'kattu',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px' }}>
                      <input style={{ ...bi, padding:'6px 6px' }} value={it.kazhi || ''} onChange={e=>setItem(idx,'kazhi',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'6px 8px' }}>
                      <input style={{ ...bi, padding:'6px 8px' }} value={it.rate || ''} onChange={e=>setItem(idx,'rate',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', padding:'4px' }}>
                      <input style={{ ...bi, fontWeight:700, color:'#38bdf8', textAlign:'right', padding:'6px 8px' }} value={it.amount || ''} onChange={e=>setItem(idx,'amount',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(255,255,255,0.06)', textAlign:'center' }}>
                      <div style={{ display:'flex', justifyContent:'center', gap:4 }}>
                        <button style={{ background:'none', border:'none', color:'#38bdf8', cursor:'pointer', fontSize:12, padding:'0 3px' }} onClick={()=>cloneRow(idx)} title="Clone row">📋</button>
                        <button style={{ background:'none', border:'none', color:'#f43f5e', cursor:'pointer', fontSize:13, padding:'0 3px' }} onClick={()=>removeRow(idx)} title="Remove row">✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{ padding:'12px 24px', borderTop:'1px solid rgba(255,255,255,0.08)', display:'flex', gap:10 }}>
          <button style={{ background:'rgba(56,189,248,0.1)', border:'1px solid rgba(56,189,248,0.3)', borderRadius:6, padding:'6px 16px', fontSize:11, color:'#38bdf8', cursor:'pointer', fontFamily:'inherit', fontWeight:600 }} onClick={addRow}>+ Add Row</button>
        </div>

        {/* Totals & Bank details */}
        <div style={{ display:'flex', borderTop:'1px solid rgba(255,255,255,0.08)', flexWrap:'wrap' }}>
          <div style={{ flex:'1 1 55%', padding:'16px 24px', borderRight:'1px solid rgba(255,255,255,0.08)' }}>
            <div style={{ fontSize:12.5, color:'#f9fafb', marginBottom:12 }}>
              <span style={{ color:'#94a3b8', fontWeight:600 }}>Rupees </span>
              <span style={{ color:'#38bdf8', fontWeight:700 }}>{numWords(net)}</span>
              <span style={{ color:'#94a3b8' }}> Only</span>
            </div>
            <div style={{ fontSize:11.5, color:'#94a3b8', lineHeight:1.7 }}>
              <span style={{ color:'#38bdf8', fontWeight:600 }}>Bank Details :</span><br/>
              <span style={{ color:'#f9fafb', fontWeight:600 }}>{company.bankName}</span><br/>
              A/c No. : {company.accountNo}<br/>IFSC : {company.ifsc}
            </div>
          </div>
          <div style={{ flex:'1 1 40%', minWidth:260 }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}><tbody>
              {[['TOTAL',fmt(sub),false],['CGST  2.50 %',fmt(cgst),false],['SGST  2.50 %',fmt(sgst),false],['ROUNDED OFF',fmt(rounded),false],['NET AMOUNT',fmt(net),true]].map(([l,v,bold]) => (
                <tr key={l} style={{ background:bold?'#2563eb':'transparent' }}>
                  <td style={{ border:'1px solid rgba(255,255,255,0.08)', padding:'8px 16px', color:bold?'#fff':'#94a3b8', fontWeight:bold?700:500, fontSize:bold?13:12 }}>{l}</td>
                  <td style={{ border:'1px solid rgba(255,255,255,0.08)', padding:'8px 16px', textAlign:'right', color:bold?'#ffffff':'#f9fafb', fontWeight:bold?800:500, fontSize:bold?15:12, fontVariantNumeric:'tabular-nums' }}>{v}</td>
                </tr>
              ))}
              <tr><td colSpan={2} style={{ border:'1px solid rgba(255,255,255,0.08)', padding:'8px 16px', textAlign:'right', fontSize:11, color:'#94a3b8', fontWeight:600, fontStyle:'italic' }}>For {company.name}</td></tr>
            </tbody></table>
          </div>
        </div>
        <div style={{ padding:'10px 24px', borderTop:'1px solid rgba(255,255,255,0.08)', fontSize:11, color:'#64748b' }}>
          <b style={{ color:'#94a3b8' }}>Declaration :</b> 1. All disputes under this sale subject to {company.jurisdiction} jurisdiction
        </div>
      </div>
    </div>
  );
}

// ── BILLS LIST ────────────────────────────────────────────────────────────────
function BillsList({ bills, setBills, onEditBill, onCloneBill, customers, company, onDeleteBill }) {
  const [filter, setFilter]               = useState('all');
  const [dateFilter, setDateFilter]       = useState('all');
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [search, setSearch]               = useState('');
  const [payModal, setPayModal]           = useState(null);
  const [syncingId, setSyncId]            = useState(null);
  const [organizingDrive, setOrganizing]  = useState(false);
  const [orgMessage, setOrgMessage]       = useState('');

  const confirmPaid = async (updatedPayments) => {
    const totalPaid = updatedPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const isFull = totalPaid >= payModal.netAmount;
    const u = bills.map(b => b.id === payModal.id ? {
      ...b,
      payments: updatedPayments,
      status: isFull ? 'paid' : (totalPaid > 0 ? 'partial' : 'pending'),
      paidDate: isFull ? (b.paidDate || today()) : null,
      receiptNo: isFull ? (b.receiptNo || `RCP-${b.billNo}`) : null,
    } : b);
    setBills(u);
    await api.storeSet('sgc-bills', u);
    setPayModal(null);
  };

  const del = async (id) => {
    if (onDeleteBill) {
      await onDeleteBill(id);
    } else {
      if (!confirm('Are you sure you want to delete this bill?')) return;
      const u = bills.filter(b => b.id !== id);
      setBills(u);
      await api.storeSet('sgc-bills', u);
    }
  };

  const resync = async (bill) => {
    setSyncId(bill.id);
    const result = await api.saveAndUploadBill({ billData: bill, htmlContent: generateBillHTML(bill, company) });
    if (result.success) {
      const u = bills.map(b => b.id === bill.id ? {
        ...b,
        driveUrl: result.driveUrl,
        driveFileId: result.fileId,
        vaultFiles: result.vaultFiles,
        monthFolder: result.monthFolderName || b.monthFolder,
        monthFolderId: result.monthFolderId || b.monthFolderId,
      } : b);
      setBills(u);
      await api.storeSet('sgc-bills', u);
    }
    setSyncId(null);
  };

  const handleDownloadCSV = async () => {
    const csvContent = exportBillsToCSV(list);
    const fileNameSuffix = selectedMonth !== 'all' ? `_${selectedMonth}` : `_${today()}`;
    await api.exportFile({
      defaultName: `SGC_Bills_Export${fileNameSuffix}.csv`,
      content: csvContent,
      extension: 'csv',
    });
  };

  const handleOrganizeDrive = async () => {
    setOrganizing(true);
    setOrgMessage('Organizing Drive folders...');
    try {
      const res = await api.organizeDriveBills();
      if (res.success) {
        setOrgMessage(`✅ Organized! Moved ${res.report?.moved || 0} bills, ${res.report?.alreadyInPlace || 0} already in month folders.`);
      } else {
        setOrgMessage(`⚠ ${res.error || 'Failed to organize'}`);
      }
    } catch (e) {
      setOrgMessage(`⚠ ${e.message}`);
    }
    setOrganizing(false);
    setTimeout(() => setOrgMessage(''), 5000);
  };

  // Month Folders Breakdown
  const monthFolders = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const ym = (b.date || '').slice(0, 7);
      if (!ym) return;
      if (!map[ym]) {
        const [y, m] = ym.split('-');
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const fullNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const mIdx = parseInt(m, 10) - 1;
        const label = `${monthNames[mIdx] || m} ${y}`;
        const folderName = `${y}-${m} (${fullNames[mIdx] || m} ${y})`;
        map[ym] = { key: ym, label, folderName, count: 0, total: 0, paid: 0, pending: 0 };
      }
      map[ym].count++;
      map[ym].total += Number(b.netAmount || 0);
      const fin = getBillFinancials(b);
      map[ym].paid += fin.totalPaid;
      map[ym].pending += fin.balance;
    });
    return Object.values(map).sort((a, b) => b.key.localeCompare(a.key));
  }, [bills]);

  // Filtering
  const now = new Date();
  const currentMonth = getMonthKey(now);
  const lastMonth = getRelativeMonthKey(-1, now);

  const list = bills.filter(b => {
    const fin = getBillFinancials(b);
    if (filter === 'paid'    && fin.computedStatus !== 'paid') return false;
    if (filter === 'pending' && fin.computedStatus !== 'pending') return false;
    if (filter === 'partial' && fin.computedStatus !== 'partial') return false;

    if (selectedMonth !== 'all' && (!b.date || !b.date.startsWith(selectedMonth))) return false;

    if (dateFilter === 'this-month' && (!b.date || !b.date.startsWith(currentMonth))) return false;
    if (dateFilter === 'last-month' && (!b.date || !b.date.startsWith(lastMonth))) return false;

    if (search) {
      const s = search.toLowerCase();
      const matchCustomer = (b.customer || '').toLowerCase().includes(s);
      const matchNo       = String(b.billNo || '').includes(s);
      const matchDel      = (b.items || []).some(it => (it.delNo || '').toLowerCase().includes(s));
      const matchPo       = (b.items || []).some(it => (it.poNo || '').toLowerCase().includes(s));
      if (!matchCustomer && !matchNo && !matchDel && !matchPo) return false;
    }
    return true;
  }).sort((a, b) => Number(b.billNo) - Number(a.billNo));

  const syncedCount  = bills.filter(b => b.driveUrl).length;
  const pendingCount = bills.filter(b => getBillFinancials(b).computedStatus === 'pending').length;
  const partialCount = bills.filter(b => getBillFinancials(b).computedStatus === 'partial').length;
  const paidCount    = bills.filter(b => getBillFinancials(b).computedStatus === 'paid').length;

  return (
    <div className="fade-in">
      {payModal && <PaymentModal bill={payModal} onConfirm={confirmPaid} onCancel={()=>setPayModal(null)} />}

      {/* Top Banner */}
      <div style={{ background:'rgba(52,168,83,0.08)', border:'1px solid rgba(52,168,83,0.3)', borderRadius:12, padding:'12px 18px', marginBottom:18, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
        <div style={{ fontSize:12, color:C.drive, fontWeight:600, display:'flex', alignItems:'center', gap:8 }}>
          <span>☁ {syncedCount} of {bills.length} bills backed up to Google Drive PDF (Month-Wise Folders)</span>
          {orgMessage && <span style={{ color:C.gold, fontSize:11, marginLeft:10 }}>{orgMessage}</span>}
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button style={{ ...S.btn('drive'), padding:'6px 12px', fontSize:10 }} onClick={handleOrganizeDrive} disabled={organizingDrive}>
            {organizingDrive ? '⟳ Organizing...' : '📁 Sync Month Folders'}
          </button>
          <button style={{ ...S.btn('success'), padding:'6px 14px', fontSize:10 }} onClick={handleDownloadCSV}>
            📊 Export Bills (Excel / CSV)
          </button>
        </div>
      </div>

      {/* Month Folders Selector Bar */}
      <div style={{ display:'flex', gap:8, overflowX:'auto', paddingBottom:8, marginBottom:16, alignItems:'center' }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.gold, display:'flex', alignItems:'center', gap:5, whiteSpace:'nowrap', marginRight:4 }}>
          <span>📁 MONTH FOLDERS:</span>
        </div>
        <button
          style={{
            ...S.btn(selectedMonth === 'all' ? 'primary' : ''),
            padding: '7px 14px',
            fontSize: 11,
            display: 'flex',
            alignItems: 'center',
            gap: 6,
            borderRadius: 8,
            whiteSpace: 'nowrap',
            fontWeight: selectedMonth === 'all' ? 700 : 500
          }}
          onClick={() => setSelectedMonth('all')}
        >
          <span>📁 All Months</span>
          <span style={{ background:'rgba(255,255,255,0.15)', borderRadius:10, padding:'1px 6px', fontSize:10 }}>{bills.length}</span>
        </button>
        {monthFolders.map(mf => (
          <button
            key={mf.key}
            style={{
              ...S.btn(selectedMonth === mf.key ? 'blue' : ''),
              background: selectedMonth === mf.key ? 'linear-gradient(135deg, #1e4d8c 0%, #2563eb 100%)' : 'rgba(255,255,255,0.04)',
              border: selectedMonth === mf.key ? '1px solid #60a5fa' : '1px solid rgba(255,255,255,0.08)',
              padding: '7px 14px',
              fontSize: 11,
              display: 'flex',
              alignItems: 'center',
              gap: 6,
              borderRadius: 8,
              whiteSpace: 'nowrap',
              color: selectedMonth === mf.key ? '#fff' : C.textMuted,
              fontWeight: selectedMonth === mf.key ? 700 : 500
            }}
            onClick={() => setSelectedMonth(mf.key)}
          >
            <span>📁 {mf.label}</span>
            <span style={{ background: selectedMonth === mf.key ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.08)', borderRadius:10, padding:'1px 6px', fontSize:10, color:'#fff' }}>
              {mf.count}
            </span>
          </button>
        ))}
      </div>

      {/* Active Month Folder Overview Card (when a month is selected) */}
      {selectedMonth !== 'all' && (() => {
        const curMf = monthFolders.find(m => m.key === selectedMonth);
        if (!curMf) return null;
        return (
          <div style={{
            background: 'linear-gradient(135deg, rgba(30,77,140,0.35) 0%, rgba(15,36,71,0.55) 100%)',
            border: '1px solid rgba(59,130,246,0.4)',
            borderRadius: 12,
            padding: '14px 18px',
            marginBottom: 18,
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            flexWrap: 'wrap',
            gap: 12
          }}>
            <div>
              <div style={{ fontSize: 10.5, color: '#93c5fd', fontWeight: 700, letterSpacing: 1.5, textTransform: 'uppercase' }}>
                📁 ALLOCATED GOOGLE DRIVE FOLDER:
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, color: '#fff', display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>
                <span>{curMf.folderName}</span>
                <span style={{ fontSize: 11, background: 'rgba(59,130,246,0.25)', color: '#93c5fd', padding: '2px 8px', borderRadius: 6 }}>
                  {curMf.count} Bills
                </span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Billed</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: C.text }}>{fmtINR(curMf.total)}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Collected</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: C.green }}>{fmtINR(curMf.paid)}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Balance Due</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: curMf.pending > 0 ? C.red : C.green }}>{fmtINR(curMf.pending)}</div>
              </div>
              <button
                style={{ ...S.btn('drive'), padding: '7px 12px', fontSize: 10, display: 'flex', alignItems: 'center', gap: 5 }}
                onClick={() => api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9')}
                title="Open Master Bills Vault in Google Drive"
              >
                ☁ Open in Drive ↗
              </button>
            </div>
          </div>
        );
      })()}

      {/* Filters bar */}
      <div style={{ display:'flex', gap:10, marginBottom:20, flexWrap:'wrap', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
          <input style={{ ...S.input, maxWidth:260 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search Bill No, Party, Del No..." />
          {[
            ['all', `All (${bills.length})`],
            ['pending', `Pending (${pendingCount})`],
            ['partial', `Partial (${partialCount})`],
            ['paid', `Paid (${paidCount})`],
          ].map(([v, l]) => (
            <button key={v} style={{ ...S.btn(filter===v?'primary':''), padding:'8px 12px' }} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>

        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <span style={{ fontSize:11, color:C.textMuted }}>Period:</span>
          {[
            ['all', 'All Time'],
            ['this-month', 'This Month'],
            ['last-month', 'Last Month'],
          ].map(([v, l]) => (
            <button key={v} style={{ ...S.btn(dateFilter===v?'blue':''), padding:'6px 10px', fontSize:10 }} onClick={()=>setDateFilter(v)}>{l}</button>
          ))}
        </div>
      </div>

      {/* Bills Table */}
      <div style={S.section}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', minWidth:980, borderCollapse:'collapse' }}>
            <thead><tr>
              <th style={S.th}>Bill No</th>
              <th style={S.th}>Date</th>
              <th style={S.th}>Customer</th>
              <th style={S.th}>Net Amount</th>
              <th style={S.th}>Status</th>
              <th style={S.th}>Paid / Balance</th>
              <th style={{ ...S.th, color:C.drive }}>☁ Drive</th>
              <th style={{ ...S.th, textAlign:'right' }}>Actions</th>
            </tr></thead>
            <tbody>
              {list.map(b => {
                const fin = getBillFinancials(b);
                const matchedCust = customers.find(c => c.name.toLowerCase() === (b.customer||'').toLowerCase());
                return (
                  <tr key={b.id} style={{ opacity:fin.computedStatus==='paid'?0.8:1 }}>
                    <td style={{ ...S.td, fontWeight:800, color:C.gold }}>#{b.billNo}</td>
                    <td style={{ ...S.td, color:C.textMuted, fontSize:12 }}>
                      <div>{b.date}</div>
                      {b.monthFolder && (
                        <div style={{ fontSize:9, color:'#60a5fa', opacity:0.85, marginTop:2 }}>
                          📁 {b.monthFolder.split(' ')[0]}
                        </div>
                      )}
                    </td>
                    <td style={{ ...S.td, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontWeight:600 }}>
                      {b.customer}
                    </td>
                    <td style={{ ...S.td, fontWeight:800, color:C.text }}>{fmtINR(b.netAmount)}</td>
                    <td style={S.td}>
                      <button onClick={()=>setPayModal(b)} style={{ background:'none', border:'none', cursor:'pointer', padding:0 }}>
                        <span style={S.badge(fin.computedStatus==='paid'?'green':fin.computedStatus==='partial'?'orange':'danger')}>
                          {fin.computedStatus==='paid'?'✓ Paid':fin.computedStatus==='partial'?'● Partial':'● Pending'}
                        </span>
                      </button>
                    </td>
                    <td style={{ ...S.td, fontSize:12 }}>
                      {fin.computedStatus==='paid' ? (
                        <span style={{ color:C.green }}>{fmtINR(fin.totalPaid)}</span>
                      ) : (
                        <div>
                          <div style={{ color:C.red, fontWeight:700 }}>Due: {fmtINR(fin.balance)}</div>
                          {fin.totalPaid > 0 && <div style={{ color:C.green, fontSize:10 }}>Paid: {fmtINR(fin.totalPaid)}</div>}
                        </div>
                      )}
                    </td>
                    <td style={S.td}>
                      {b.driveUrl ? (
                        <div>
                          <span onClick={()=>api.openExternal(b.driveUrl)}
                            style={{ color:C.drive, fontSize:11, cursor:'pointer', textDecoration:'underline', fontWeight:600 }}>☁ PDF Open</span>
                        </div>
                      ) : syncingId===b.id ? (
                        <span style={{ fontSize:11, color:C.drive }}>⟳ Uploading...</span>
                      ) : (
                        <button style={{ ...S.btn('drive'), padding:'4px 8px', fontSize:10 }} onClick={()=>resync(b)}>↑ Upload</button>
                      )}
                    </td>
                    <td style={{ ...S.td, textAlign:'right' }}>
                      <div style={{ display:'inline-flex', gap:5 }}>
                        <button style={{ ...S.btn('whatsapp'), padding:'5px 8px', fontSize:11 }} onClick={()=>api.openExternal(getWhatsAppShareUrl(b, matchedCust?.phone || ''))} title="Share on WhatsApp">💬</button>
                        <button style={{ ...S.btn('blue'), padding:'5px 8px', fontSize:11 }} onClick={()=>api.printBill(generateBillHTML(b, company))} title="Print Bill">🖨</button>
                        <button style={{ ...S.btn(), padding:'5px 8px', fontSize:11 }} onClick={()=>onEditBill(b)} title="Edit Bill">✎</button>
                        <button style={{ ...S.btn(), padding:'5px 8px', fontSize:11 }} onClick={()=>onCloneBill(b)} title="Clone Bill">📑</button>
                        <button style={{ ...S.btn('danger'), padding:'5px 8px', fontSize:11 }} onClick={()=>del(b.id)} title="Delete Bill">✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {list.length===0 && (
                <tr><td colSpan={8} style={{ ...S.td, textAlign:'center', color:C.textMuted, padding:40 }}>No bills match criteria</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── ANALYTICS & REPORTS PAGE ──────────────────────────────────────────────────
function AnalyticsPage({ bills, customers }) {
  const totalTurnover = bills.reduce((s,b)=>s+Number(b.netAmount||0),0);
  const totalCollected = bills.reduce((s,b)=>s+getBillFinancials(b).totalPaid,0);
  const totalDue = Math.max(0, totalTurnover - totalCollected);

  // Monthly breakdown
  const monthlyData = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const m = (b.date || '').slice(0, 7) || 'Other';
      if (!map[m]) map[m] = { month: m, billed: 0, collected: 0 };
      map[m].billed += Number(b.netAmount || 0);
      map[m].collected += getBillFinancials(b).totalPaid;
    });
    return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).slice(-8);
  }, [bills]);

  const maxMonthVal = Math.max(...monthlyData.map(m => Math.max(m.billed, m.collected)), 1000);

  // Top Customers
  const topCustomers = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const name = b.customer || 'Unknown';
      if (!map[name]) map[name] = { name, total: 0, count: 0, pending: 0 };
      map[name].total += Number(b.netAmount || 0);
      map[name].pending += getBillFinancials(b).balance;
      map[name].count += 1;
    });
    return Object.values(map).sort((a,b)=>b.total - a.total).slice(0, 6);
  }, [bills]);

  // Count distribution
  const countStats = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      (b.items || []).forEach(it => {
        const c = autoFormatCount(it.count) || 'Unspecified';
        if (!map[c]) map[c] = { count: c, kattu: 0, kazhi: 0, amount: 0 };
        map[c].kattu += Number(it.kattu || 0);
        map[c].kazhi += Number(it.kazhi || 0);
        map[c].amount += Number(it.amount || 0);
      });
    });
    return Object.values(map).sort((a,b)=>b.amount - a.amount).slice(0, 6);
  }, [bills]);

  return (
    <div className="fade-in">
      <div style={{ marginBottom:22 }}>
        <div style={{ fontSize:10, letterSpacing:4, textTransform:'uppercase', color:C.gold }}>Business Intelligence</div>
        <div style={{ fontSize:26, fontWeight:800, color:C.text }}>Financial Analytics & Insights</div>
      </div>

      {/* KPI Cards */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))', gap:14, marginBottom:26 }}>
        <div style={S.card(C.gold)}>
          <div style={S.label}>Total Turnover</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.gold }}>{fmtINR(totalTurnover)}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>{bills.length} total bills issued</div>
        </div>
        <div style={S.card(C.green)}>
          <div style={S.label}>Cash Realized</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.green }}>{fmtINR(totalCollected)}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>{totalTurnover>0?((totalCollected/totalTurnover)*100).toFixed(1):0}% collection rate</div>
        </div>
        <div style={S.card(C.red)}>
          <div style={S.label}>Market Outstanding Due</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.red }}>{fmtINR(totalDue)}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>Uncollected receivables</div>
        </div>
        <div style={S.card(C.blue)}>
          <div style={S.label}>Active Parties</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.blue }}>{customers.length}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>Registered yarn parties</div>
        </div>
      </div>

      {/* Monthly Chart */}
      <div style={S.section}>
        <div style={S.secTitle}>📈 Monthly Sales & Collection Trend</div>
        <div style={{ height:200, display:'flex', alignItems:'flex-end', gap:20, paddingTop:30, paddingBottom:10, overflowX:'auto' }}>
          {monthlyData.map(m => {
            const hBilled = Math.round((m.billed / maxMonthVal) * 140);
            const hPaid   = Math.round((m.collected / maxMonthVal) * 140);
            return (
              <div key={m.month} style={{ flex:'1 0 70px', display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
                <div style={{ display:'flex', alignItems:'flex-end', gap:4, height:140 }}>
                  <div style={{ width:16, height:Math.max(4, hBilled), background:C.gold, borderRadius:'4px 4px 0 0', title:`Billed: ${fmtINR(m.billed)}` }}></div>
                  <div style={{ width:16, height:Math.max(4, hPaid), background:C.green, borderRadius:'4px 4px 0 0', title:`Collected: ${fmtINR(m.collected)}` }}></div>
                </div>
                <div style={{ fontSize:10, color:C.textMuted, fontWeight:700 }}>{m.month}</div>

}

// ── MONTHLY GST TAX FILING RADAR ──────────────────────────────────────────────
function MonthlyGSTRadar({ bills, company }) {
  const [copied, setCopied] = useState(false);

  // Deterministic Local Calendar Month Keys (IST Safe - 0% Timezone Drift)
  const now = new Date();
  const currentMonthKey = getMonthKey(now);
  const prevMonthKey    = getRelativeMonthKey(-1, now);

  // Group all available months with GST data
  const monthData = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const ym = (b.date || '').slice(0, 7);
      if (!ym) return;
      if (!map[ym]) {
        map[ym] = {
          key: ym,
          label: getMonthLabel(ym),
          shortLabel: getMonthShortLabel(ym),
          subtotal: 0,
          cgst: 0,
          sgst: 0,
          totalGst: 0,
          gross: 0,
          count: 0,
          billNos: []
        };
      }
      map[ym].subtotal += Number(b.subtotal || 0);
      map[ym].cgst += Number(b.cgst || 0);
      map[ym].sgst += Number(b.sgst || 0);
      map[ym].gross += Number(b.netAmount || 0);
      map[ym].count += 1;
      if (b.billNo !== undefined && b.billNo !== null) map[ym].billNos.push(Number(b.billNo));
    });

    Object.values(map).forEach(m => {
      m.totalGst = m.cgst + m.sgst;
    });

    return map;
  }, [bills]);

  const getSafeStats = (key) => {
    return monthData[key] || {
      key,
      label: getMonthLabel(key),
      shortLabel: getMonthShortLabel(key),
      subtotal: 0,
      cgst: 0,
      sgst: 0,
      totalGst: 0,
      gross: 0,
      count: 0,
      billNos: []
    };
  };

  const thisStats = getSafeStats(currentMonthKey);
  const prevStats = getSafeStats(prevMonthKey);

  // Default to previous month if today is <= 20th of the month, else current month
  const [selectedMonth, setSelectedMonth] = useState(prevMonthKey);

  const availableMonths = useMemo(() => {
    const keys = Object.keys(monthData);
    if (!keys.includes(prevMonthKey)) keys.push(prevMonthKey);
    if (!keys.includes(currentMonthKey)) keys.push(currentMonthKey);
    return keys.sort().reverse();
  }, [monthData, prevMonthKey, currentMonthKey]);

  // Selected month stats
  const cur = getSafeStats(selectedMonth);

  const billRange = cur.billNos.length > 0
    ? `#${Math.min(...cur.billNos)} - #${Math.max(...cur.billNos)}`

*${company.name}* — GST Tax Summary for GSTR Filing:

🧾 Total Invoices: ${cur.count} Bills (${billRange})

GSTIN: ${company.gstin}
Kindly file GSTR-3B / GSTR-1.`;

// ── ANIMATED COUNTER ──────────────────────────────────────────────────────────
function AnimatedCounter({ value, duration = 800, isCurrency = false, prefix = '', suffix = '' }) {
  const [displayVal, setDisplayVal] = useState(0);
  const targetVal = typeof value === 'number' ? value : (parseFloat(String(value).replace(/[^0-9.-]+/g, '')) || 0);

  useEffect(() => {
    let startTimestamp = null;
    const startVal = displayVal;
    let animId;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      // easeOutCubic
      const ease = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(startVal + (targetVal - startVal) * ease);
      setDisplayVal(current);

      if (progress < 1) {
        animId = requestAnimationFrame(step);
      }
    };

    animId = requestAnimationFrame(step);
    return () => cancelAnimationFrame(animId);
  }, [targetVal, duration]);

  if (isCurrency) {
    return <span>{fmtINR(displayVal)}</span>;
  }
  return <span>{prefix}{displayVal.toLocaleString('en-IN')}{suffix}</span>;
}

  };

    await api.storeSet('sgc-company-profile', compEdit);

    alert('Company details updated successfully!');
  };

    const backupData = {
      version: '5.0',
      exportedAt: new Date().toISOString(),
      bills,
      customers,
      countMap,
      company: compEdit,
      folderId,
    };

    const res = await api.exportFile({
      defaultName: `SGC_Billing_Full_Backup_${today()}.json`,
      content,
      extension: 'json',
    });
    if (res.success) {
      setBackupMsg('✅ Backup downloaded successfully!');
      setTimeout(()=>setBackupMsg(''), 3000);
    }
  };

  const handleRestoreBackup = async () => {
    const res = await api.importFile();

        alert('Invalid backup file structure!');

        if (data.company)   { setCompany(data.company); setCompEdit(data.company); await api.storeSet('sgc-company-profile', data.company); }

    <div className="fade-in">

      const res = await api.gmailAuthStatus();
      setGmailConnected(res.connected);

    const res = await api.gmailAuthStart();

// ── DRIVE AUTH PAGE ───────────────────────────────────────────────────────────
function DriveAuthPage({ onConnected }) {
  const [step, setStep]         = useState(1);
  const [authCode, setAuthCode] = useState('');
  const [msg, setMsg]           = useState('');
  const [loading, setLoading]   = useState(false);
  const fileRef = useRef(null);

  const handleFastConnect = async () => {
    setLoading(true);
    setMsg('⟳ Opening browser for Google login... Please select your account and click Allow.');
    try {
      const res = await api.googleAuthStart();
      if (res && res.success) {
        setMsg('⟳ Waiting for browser authorization in Chrome/Edge...');
        let count = 0;
        const interval = setInterval(async () => {
          count++;
          const st = await api.googleAuthStatus();
          if (st && st.connected) {
            clearInterval(interval);
            setMsg('✅ Connected! Google Drive is ready.');
            setStep(3);
            setTimeout(() => onConnected(), 1200);
          }
          if (count > 60) {
            clearInterval(interval);
            setLoading(false);
          }
        }, 2000);
      } else {
        setMsg(`❌ Error: ${res ? res.error : 'Failed to start auth'}`);
        setLoading(false);
      }
    } catch (err) {
      setMsg(`❌ Error: ${err.message}`);
      setLoading(false);
    }
  };

  const handleFileUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      if (!json.installed) { setMsg('❌ Wrong file — "installed" key not found in client_secret.json!'); return; }
      setLoading(true);
      const res = await api.googleAuthStart(json);
      if (res.success) {
        setMsg('✅ Browser opened for Google login. Login and approve.');
        setStep(2);
        let count = 0;
        const interval = setInterval(async () => {
          count++;
          const st = await api.googleAuthStatus();
          if (st && st.connected) {
            clearInterval(interval);
            setMsg('✅ Connected! Google Drive is ready.');
            setStep(3);
            setTimeout(() => onConnected(), 1200);
          }
          if (count > 60) {
            clearInterval(interval);
            setLoading(false);
          }
        }, 2000);
      } else {
        setMsg(`❌ Error: ${res.error}`);
        setLoading(false);
      }
    } catch (err) {
      setMsg(`❌ JSON parse error: ${err.message}`);
      setLoading(false);
    }
  };

  const handleCodeSubmit = async () => {
    if (!authCode.trim()) { setMsg('❌ Enter Google Auth Code!'); return; }
    setLoading(true);
    try {
      const res = await api.googleAuthExchange(authCode);
      if (res.success) {
        setMsg('✅ Connected! Google Drive is ready.');
        setStep(3);
        setTimeout(() => onConnected(), 1200);
      } else {
        setMsg(`❌ ${res.error}`);
      }
    } catch (err) {
      setMsg(`❌ ${err.message}`);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="fade-in" style={{ maxWidth:580, margin:'40px auto' }}>
      <div style={S.section}>
        <div style={{ fontSize:36, marginBottom:12, textAlign:'center' }}>☁</div>
        <div style={{ fontSize:20, fontWeight:800, color:C.gold, textAlign:'center', marginBottom:8 }}>Connect Google Drive</div>
        <div style={{ fontSize:12, color:C.textMuted, textAlign:'center', marginBottom:26 }}>
          One-time authentication to automatically sync your PDF bills to Mukil's Master Google Drive Vault.
        </div>

        {/* 1-Click Fast Connect */}
        <div style={{ background:'rgba(52,168,83,0.1)', border:'1.5px solid rgba(52,168,83,0.4)', borderRadius:12, padding:18, marginBottom:20, textAlign:'center' }}>
          <div style={{ fontSize:15, fontWeight:800, color:C.green, marginBottom:6 }}>⚡ 1-Click Fast Connect</div>
          <div style={{ fontSize:12, color:C.textMuted, marginBottom:14 }}>Uses Mukil's pre-configured SGC Billing OAuth client directly. Opens browser automatically.</div>
          <button style={{ ...S.btn('drive'), padding:'10px 24px', fontSize:13, fontWeight:700 }} onClick={handleFastConnect} disabled={loading}>
            {loading ? '⟳ Connecting in Browser...' : '🚀 Connect Google Drive Now'}
          </button>
        </div>

        <div style={{ textAlign:'center', fontSize:11, color:C.textMuted, marginBottom:16 }}>— OR MANUAL CONFIGURATION —</div>

        <div style={{ background: step===1?'rgba(255,200,74,0.08)':'rgba(255,255,255,0.02)', border:`1px solid ${step===1?C.gold+'44':'rgba(255,255,255,0.08)'}`, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:11, color:step===1?C.gold:C.textMuted, fontWeight:700, letterSpacing:1.5, marginBottom:8 }}>CUSTOM — Upload client_secret.json</div>
          {step === 1 ? (
            <>
              <p style={{ fontSize:12, color:C.textMuted, marginBottom:12 }}>Select a custom <b style={{ color:C.text }}>client_secret_*.json</b> file from Google Cloud Console.</p>
              <input ref={fileRef} type="file" accept=".json" style={{ display:'none' }} onChange={handleFileUpload} />
              <button style={S.btn('primary')} onClick={()=>fileRef.current.click()} disabled={loading}>
                {loading ? '⟳ Processing...' : '📂 Choose JSON Secret'}
              </button>
            </>
          ) : (
            <div style={{ color:C.green, fontSize:12 }}>✅ Client Secret loaded</div>
          )}
        </div>

        {step === 2 && (
          <div style={{ background: 'rgba(255,200,74,0.08)', border:`1px solid ${C.gold+'44'}`, borderRadius:10, padding:16, marginBottom:14 }}>
            <div style={{ fontSize:11, color:C.gold, fontWeight:700, letterSpacing:1.5, marginBottom:8 }}>STEP 2 — Enter Verification Code (if loopback didn't catch)</div>
            <p style={{ fontSize:12, color:C.textMuted, marginBottom:12 }}>If browser provided a manual code, paste below:</p>
            <input style={{ ...S.input, marginBottom:10 }} value={authCode} onChange={e=>setAuthCode(e.target.value)} placeholder="4/0AX4XfWi..." />
            <button style={S.btn('success')} onClick={handleCodeSubmit} disabled={loading}>
              {loading ? '⟳ Verifying...' : '✓ Complete Drive Connection'}
            </button>
          </div>
        )}

        {msg && (
          <div style={{ marginTop:14, padding:'10px 14px', background:'rgba(255,255,255,0.05)', borderRadius:8, fontSize:12, color:msg.startsWith('✅')?C.green:C.red }}>
            {msg}
          </div>
        )}
      </div>
    </div>
  );
}
