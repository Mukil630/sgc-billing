const fmtINR = (n) => `₹${Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;

function numWords(n) {
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  n = Math.round(n);
  if (n === 0) return 'Zero';
  if (n < 20)  return a[n];
  if (n < 100) return b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '');
  if (n < 1000) return a[Math.floor(n/100)]+' Hundred'+(n%100 ? ' '+numWords(n%100) : '');
  if (n < 100000) return numWords(Math.floor(n/1000))+' Thousand'+(n%1000 ? ' '+numWords(n%1000) : '');
  if (n < 10000000) return numWords(Math.floor(n/100000))+' Lakh'+(n%100000 ? ' '+numWords(n%100000) : '');
  return numWords(Math.floor(n/10000000))+' Crore'+(n%10000000 ? ' '+numWords(n%10000000) : '');
}

function calcAmount(kattu, kazhi, rate, count, countMap) {
  const k  = Number(kattu) || 0;
  const kz = Number(kazhi) || 0;
  const r  = Number(rate)  || 0;
  if (r === 0 || (k === 0 && kz === 0)) return 0;
  if (k === 0) return kz * r;
  if (kz === 0) return k * r;
  const countKey = (count || '').toString().trim().toLowerCase();
  const mapping  = countMap.find(m => m.count.toLowerCase() === countKey);
  if (!mapping || !Number(mapping.kazhi)) return k * r + kz * r;
  return (k * r) + (kz * (r / Number(mapping.kazhi)));
}

function getEffective(items, idx, field) {
  for (let i = idx; i >= 0; i--) {
    if ((items[i][field] || '').toString().trim() !== '') return items[i][field];
  }
  return '';
}

function autoFormatCount(raw) {
  const v = (raw || '').trim();
  if (!v) return v;
  if (v.toLowerCase().endsWith('s')) return v;
  if (/^[\d/]+$/.test(v)) return v + 's';
  return v;
}

// ── CUSTOMER AUTOCOMPLETE ────────────────────────────────────────────────────
function CustomerAutocomplete({ value, customers, onChange, onSelect, style }) {
  const [open, setOpen]       = useState(false);
  const [filtered, setFiltered] = useState([]);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const handleChange = (val) => {
    onChange(val);
    if (!val.trim()) { setFiltered([]); setOpen(false); return; }
    const f = customers.filter(c => c.name.toLowerCase().includes(val.toLowerCase())).slice(0, 8);
    setFiltered(f); setOpen(f.length > 0);
  };
  return (
    <div ref={ref} style={{ position:'relative', flex:1 }}>
      <input style={style} value={value} onChange={e=>handleChange(e.target.value)}
        onFocus={()=>{ if (value.trim() && filtered.length > 0) setOpen(true); }}
        placeholder="Type customer name..." autoComplete="off" />
      {open && (
        <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:100, background:'#13131f', border:'1px solid rgba(59,130,246,0.4)', borderRadius:8, boxShadow:'0 8px 32px rgba(0,0,0,0.6)', marginTop:4, overflow:'hidden' }}>
          {filtered.map((c, i) => (
            <div key={c.id} onMouseDown={()=>{ onSelect(c); setOpen(false); setFiltered([]); }}
              style={{ padding:'10px 14px', cursor:'pointer', borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.05)':'none' }}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(59,130,246,0.15)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div style={{ fontSize:13, color:'#e8f0ff', fontWeight:600 }}>{c.name}</div>
              <div style={{ fontSize:10, color:'rgba(160,196,232,0.7)', marginTop:2 }}>GST: {c.gst}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── DRIVE AUTH PAGE ───────────────────────────────────────────────────────────
function DriveAuthPage({ onConnected }) {
  const [step, setStep]         = useState(1); // 1=upload secret, 2=auth code, 3=done
  const [authCode, setAuthCode] = useState('');
  const [msg, setMsg]           = useState('');
  const [loading, setLoading]   = useState(false);
  const fileRef = useRef(null);

  const handleFileUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      if (!json.installed) { setMsg('❌ Wrong file — "installed" key illa!'); return; }
      setLoading(true);
      const res = await api.googleAuthStart(json);
      if (res.success) {
        setMsg('✅ Browser la Google login page open aaguthu. Login panni code-a copy pannunga.');
        setStep(2);
      } else {
        setMsg(`❌ Error: ${res.error}`);
      }
    } catch (err) {
      setMsg(`❌ JSON parse error: ${err.message}`);
    } finally {
      setLoading(false);
    }
  };

  const handleCodeSubmit = async () => {
    if (!authCode.trim()) { setMsg('❌ Code enter pannunga!'); return; }
    setLoading(true);
    try {
      const res = await api.googleAuthExchange(authCode);
      if (res.success) {
        setMsg('✅ Connected! Drive ready.');
        setStep(3);
        setTimeout(() => onConnected(), 1500);
      } else {
        setMsg(`❌ ${res.error}`);
      }
    } catch (err) {
      setMsg(`❌ ${err.message}`);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ maxWidth:560, margin:'60px auto' }}>
      <div style={S.section}>
        <div style={{ fontSize:32, marginBottom:16, textAlign:'center' }}>☁</div>
        <div style={{ fontSize:18, fontWeight:700, color:C.gold, textAlign:'center', marginBottom:8 }}>Google Drive Connect</div>
        <div style={{ fontSize:12, color:C.muted, textAlign:'center', marginBottom:28 }}>
          Bills PDF-aa Drive la save pannanum — oru thadavai setup pannunga, done!
        </div>

        {/* Step 1 */}
        <div style={{ background: step===1?'rgba(255,200,74,0.08)':'rgba(255,255,255,0.03)', border:`1px solid ${step===1?C.gold+'44':'rgba(255,255,255,0.08)'}`, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:11, color:step===1?C.gold:C.muted, fontWeight:700, letterSpacing:2, marginBottom:8 }}>STEP 1 — client_secret.json Upload Pannunga</div>
          {step === 1 ? (
            <>
              <p style={{ fontSize:12, color:C.muted, marginBottom:12 }}>Ungal Google Cloud Console-la download panna <b style={{ color:C.text }}>client_secret.json</b> file-a select pannunga.</p>
              <input ref={fileRef} type="file" accept=".json" style={{ display:'none' }} onChange={handleFileUpload} />
              <button style={S.btn('primary')} onClick={()=>fileRef.current.click()} disabled={loading}>
                {loading ? '⟳ Processing...' : '📂 JSON File Select'}
              </button>
            </>
          ) : (
            <div style={{ color:C.green, fontSize:12 }}>✅ Client secret loaded</div>
          )}
        </div>

        {/* Step 2 */}
        <div style={{ background: step===2?'rgba(255,200,74,0.08)':'rgba(255,255,255,0.03)', border:`1px solid ${step===2?C.gold+'44':'rgba(255,255,255,0.08)'}`, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:11, color:step>=2?C.gold:C.muted, fontWeight:700, letterSpacing:2, marginBottom:8 }}>STEP 2 — Auth Code Enter Pannunga</div>
          {step === 2 && (
            <>
              <p style={{ fontSize:12, color:C.muted, marginBottom:12 }}>Browser la Google login panni, allow click pannunga. Kita varum <b style={{ color:C.text }}>code-a</b> copy panni paste pannunga.</p>
              <input style={{ ...S.input, marginBottom:10 }} value={authCode} onChange={e=>setAuthCode(e.target.value)} placeholder="4/0AX4XfWi..." />
              <button style={S.btn('success')} onClick={handleCodeSubmit} disabled={loading}>
                {loading ? '⟳ Verifying...' : '✓ Connect Drive'}
              </button>
            </>
          )}
          {step > 2 && <div style={{ color:C.green, fontSize:12 }}>✅ Auth code accepted</div>}
          {step < 2  && <div style={{ color:C.muted, fontSize:12 }}>— Step 1 complete aagattum</div>}
        </div>

        {msg && (
          <div style={{ marginTop:14, padding:'10px 14px', background:'rgba(255,255,255,0.05)', borderRadius:8, fontSize:12, color:msg.startsWith('✅')?C.green:C.red }}>
            {msg}
          </div>
        )}
      </div>
    </div>
  );
}

// ── NEW BILL FORM ─────────────────────────────────────────────────────────────
function NewBillForm({ customers, bills, countMap, onSave, editBill, driveConnected }) {
  const nextNo = editBill ? editBill.billNo : bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
  const [form, setForm]           = useState(editBill || { billNo:nextNo, date:today(), customer:'', partyGst:'', items:[{id:uid(),delNo:'',poNo:'',variety:'',count:'',kattu:'',kazhi:'',rate:'',amount:''}], status:'pending' });
  const [saving, setSaving]       = useState(false);
  const [uploadStatus, setUpload] = useState(null); // null | 'uploading' | 'done' | 'error'
  const [driveUrl, setDriveUrl]   = useState(editBill?.driveUrl || null);
  const [errMsg, setErrMsg]       = useState('');
  const [billNoEdit, setBillNoEdit] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const handleCustomerSelect = (c) => setForm(f => ({ ...f, customer: c.name, partyGst: c.gst }));

  const setItem = (idx, k, v) => {
    const items = [...form.items];
    items[idx] = { ...items[idx], [k]: v };
    if (['kattu','kazhi','rate','count'].includes(k)) {
      const it = items[idx];
      const amt = calcAmount(it.kattu, it.kazhi, it.rate, it.count, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : '';
    }
    setForm(f => ({ ...f, items }));
  };

  const handleCountBlur = (idx) => {
    const it = form.items[idx];
    const formatted = autoFormatCount(it.count);
    if (formatted !== it.count) {
      const items = [...form.items];
      items[idx] = { ...items[idx], count: formatted };
      const amt = calcAmount(items[idx].kattu, items[idx].kazhi, items[idx].rate, formatted, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : items[idx].amount;
      setForm(f => ({ ...f, items }));
    }
  };

  const addRow    = () => setForm(f => ({ ...f, items: [...f.items, { id:uid(), delNo:'', poNo:'', variety:'', count:'', kattu:'', kazhi:'', rate:'', amount:'' }] }));
  const removeRow = (idx) => { if (form.items.length === 1) return; setForm(f => ({ ...f, items: f.items.filter((_,i)=>i!==idx) })); };

  const sub     = form.items.reduce((s, i) => s + Number(i.amount || 0), 0);
  const cgst    = sub * 0.025;
  const sgst    = sub * 0.025;
  const rawNet  = sub + cgst + sgst;
  const net     = Math.round(rawNet);
  const rounded = net - rawNet;

  const handleSave = async () => {
    if (!form.customer.trim()) { alert('Customer name required!'); return; }
    setSaving(true);
    setUpload('uploading');
    setErrMsg('');

    const bill = {
      ...form,
      billNo:   Number(form.billNo),
      subtotal: sub, cgst, sgst,
      netAmount: net,
      id: form.id || uid(),

    // 2. Generate HTML

    if (result.success) {
      const billWithUrl = { ...bill, driveUrl: result.driveUrl, driveFileId: result.fileId };

    const pb = { ...form, billNo: Number(form.billNo), subtotal: sub, cgst, sgst, netAmount: net, id: 'preview' };
    api.printBill(generateBillHTML(pb));

          <div style={{ fontSize:10, letterSpacing:4, textTransform:'uppercase', color:C.gold }}>Sri Ganapathi Colours</div>

        </div>

            <span style={{ fontSize:11, color:C.drive, display:'flex', alignItems:'center', gap:5 }}>
              <span style={{ display:'inline-block', animation:'spin 1s linear infinite' }}>⟳</span>

        </div>
        <div style={{ padding:'6px 18px', borderTop:'1px solid #1e4d8c', fontSize:10, color:'#6a8ab0' }}>
          <b style={{ color:'#7bc8ff' }}>Declaration :</b> 1. All disputes under this sale subject to KARUR jurisdiction
        </div>
      </div>
    </div>
  );
}

// ── BILLS LIST ────────────────────────────────────────────────────────────────
function BillsList({ bills, setBills, onSave }) {
  const [filter, setFilter]     = useState('all');
  const [search, setSearch]     = useState('');
  const [payModal, setPayModal] = useState(null);
  const [syncingId, setSyncId]  = useState(null);

  const handleToggle = async (bill) => {
    if (bill.status !== 'paid') { setPayModal(bill); }
    else {
      const u = bills.map(b=>b.id===bill.id?{...b,status:'pending',paidDate:null,receiptNo:null}:b);
      setBills(u); await api.storeSet('sgc-bills', u);
    }
  };

  const confirmPaid = async (paidDate, receiptNo) => {
    const u = bills.map(b=>b.id===payModal.id?{...b,status:'paid',paidDate,receiptNo}:b);
    setBills(u); await api.storeSet('sgc-bills', u); setPayModal(null);
  };

  const del = async (id) => {
    if (!confirm('Delete this bill?')) return;
    const u = bills.filter(b=>b.id!==id);
    setBills(u); await api.storeSet('sgc-bills', u);
  };

  const resync = async (bill) => {
    setSyncId(bill.id);
    const result = await api.saveAndUploadBill({ billData:bill, htmlContent:generateBillHTML(bill) });
    if (result.success) {
      const u = bills.map(b=>b.id===bill.id?{...b,driveUrl:result.driveUrl,driveFileId:result.fileId}:b);
      setBills(u); await api.storeSet('sgc-bills', u);
    }
    setSyncId(null);
  };

  const synced  = bills.filter(b=>b.driveUrl).length;
  const list    = bills.filter(b=>{
    if (filter==='paid'    && b.status!=='paid') return false;
    if (filter==='pending' && b.status==='paid') return false;
    if (search && !`${b.billNo} ${b.customer}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>b.billNo-a.billNo);

  const pc = bills.filter(b=>b.status!=='paid').length;
  const pd = bills.filter(b=>b.status==='paid').length;

  return (
    <div>
      {payModal && <PaymentModal bill={payModal} onConfirm={confirmPaid} onCancel={()=>setPayModal(null)} />}
      <div style={{ background:'rgba(52,168,83,0.08)', border:'1px solid rgba(52,168,83,0.25)', borderRadius:10, padding:'10px 16px', marginBottom:16, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:8 }}>
        <div style={{ fontSize:12, color:C.drive }}>{synced} of {bills.length} bills — PDF Drive la iruku ☁</div>
      </div>
      <div style={{ display:'flex', gap:10, marginBottom:18, flexWrap:'wrap', alignItems:'center' }}>
        <input style={{ ...S.input, maxWidth:240 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Bill No. or Company..." />
        {[['all',`All (${bills.length})`],['pending',`Pending (${pc})`],['paid',`Paid (${pd})`]].map(([v,l]) => (
          <button key={v} style={{ ...S.btn(filter===v?'primary':''), padding:'8px 14px' }} onClick={()=>setFilter(v)}>{l}</button>
        ))}
      </div>
      <div style={S.section}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', minWidth:900 }}>
            <thead><tr>
              <th style={S.th}>Bill No</th><th style={S.th}>Date</th><th style={S.th}>Customer</th>
              <th style={S.th}>Net Amount</th><th style={S.th}>Status</th><th style={S.th}>Paid Date</th>
              <th style={{ ...S.th, color:C.drive }}>☁ PDF Drive</th><th style={S.th}>Actions</th>
            </tr></thead>
            <tbody>
              {list.map(b => (
                <tr key={b.id} style={{ opacity:b.status==='paid'?0.75:1 }}>
                  <td style={{ ...S.td, fontWeight:700, color:C.gold }}>#{b.billNo}</td>
                  <td style={{ ...S.td, color:C.muted, fontSize:12 }}>{b.date}</td>
                  <td style={{ ...S.td, maxWidth:180, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{b.customer}</td>
                  <td style={{ ...S.td, fontWeight:700 }}>{fmtINR(b.netAmount)}</td>
                  <td style={S.td}>
                    <button onClick={()=>handleToggle(b)} style={{ background:'none', border:'none', cursor:'pointer', padding:0 }}>
                      <span style={S.badge(b.status==='paid'?'green':'orange')}>{b.status==='paid'?'✓ Paid':'● Pending'}</span>
                    </button>
                  </td>
                  <td style={{ ...S.td, fontSize:12, color:C.muted }}>{b.paidDate||'—'}</td>
                  <td style={S.td}>
                    {b.driveUrl ? (
                      <span onClick={()=>api.openExternal(b.driveUrl)}
                        style={{ color:C.drive, fontSize:11, cursor:'pointer', textDecoration:'underline' }}>☁ PDF Open</span>
                    ) : syncingId===b.id ? (
                      <span style={{ fontSize:11, color:C.drive }}>⟳ Uploading...</span>
                    ) : (
                      <button style={{ ...S.btn('drive'), padding:'4px 9px', fontSize:10 }} onClick={()=>resync(b)}>↑ Upload PDF</button>
                    )}
                  </td>
                  <td style={S.td}>
                    <div style={{ display:'flex', gap:6 }}>
                      <button style={{ ...S.btn(), padding:'5px 10px', fontSize:10 }} onClick={()=>api.printBill(generateBillHTML(b))}>🖨</button>
                      <button style={{ ...S.btn('danger'), padding:'5px 10px', fontSize:10 }} onClick={()=>del(b.id)}>Del</button>
                    </div>
                  </td>
                </tr>
              ))}
              {list.length===0 && <tr><td colSpan={8} style={{ ...S.td, textAlign:'center', color:C.muted, padding:40 }}>No bills found</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({ bills }) {
  const totalAmt   = bills.reduce((s,b)=>s+Number(b.netAmount||0),0);
  const pendingAmt = bills.filter(b=>b.status!=='paid').reduce((s,b)=>s+Number(b.netAmount||0),0);
  const paidAmt    = bills.filter(b=>b.status==='paid').reduce((s,b)=>s+Number(b.netAmount||0),0);
  const synced     = bills.filter(b=>b.driveUrl).length;
  const stats = [
    [fmtINR(totalAmt),  C.gold,  'Total Billed'],
    [fmtINR(pendingAmt),C.red,   'Pending'],
    [fmtINR(paidAmt),   C.green, 'Collected'],
    [`${synced}/${bills.length}`, C.drive, 'PDF in Drive'],
    [`${bills.length}`, C.blue,  'Total Bills'],
    [`${bills.filter(b=>b.status!=='paid').length}`, C.red, 'Pending Bills'],
  ];
  return (
    <div>
      <div style={{ marginBottom:24 }}>
        <div style={{ fontSize:10, letterSpacing:4, textTransform:'uppercase', color:C.gold }}>Sri Ganapathi Colours</div>
        <div style={{ fontSize:28, fontWeight:700, color:C.text }}>Dashboard</div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:14, marginBottom:28 }}>
        {stats.map(([v,c,l]) => (
          <div key={l} style={S.card(c)}>
            <div style={{ fontSize:10, letterSpacing:2, textTransform:'uppercase', color:C.muted, marginBottom:6 }}>{l}</div>
            <div style={{ fontSize:22, fontWeight:700, color:c }}>{v}</div>
          </div>
        ))}
      </div>
      <div style={S.section}>
        <div style={S.secTitle}>Recent Bills</div>
        <table style={{ width:'100%' }}>
          <thead><tr>
            <th style={S.th}>Bill No</th><th style={S.th}>Customer</th>
            <th style={S.th}>Amount</th><th style={S.th}>Status</th><th style={S.th}>PDF</th>
          </tr></thead>
          <tbody>
            {[...bills].sort((a,b)=>b.billNo-a.billNo).slice(0,8).map(b=>(
              <tr key={b.id}>
                <td style={{ ...S.td, color:C.gold, fontWeight:700 }}>#{b.billNo}</td>
                <td style={S.td}>{b.customer}</td>
                <td style={{ ...S.td, fontWeight:700 }}>{fmtINR(b.netAmount)}</td>
                <td style={S.td}><span style={S.badge(b.status==='paid'?'green':'orange')}>{b.status==='paid'?'✓ Paid':'● Pending'}</span></td>
                <td style={S.td}>
                  {b.driveUrl
                    ? <span onClick={()=>api.openExternal(b.driveUrl)} style={{ color:C.drive, fontSize:11, cursor:'pointer' }}>☁ PDF</span>
                    : <span style={{ color:C.muted, fontSize:11 }}>—</span>}
                </td>
              </tr>
            ))}
            {bills.length===0 && <tr><td colSpan={5} style={{ ...S.td, textAlign:'center', color:C.muted, padding:40 }}>No bills yet</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────────────
function SettingsPage({ countMap, setCountMap, driveConnected, onDriveConnect, onDriveDisconnect, folderId, setFolderId }) {
  const [newCount, setNewCount]   = useState('');
  const [newKazhi, setNewKazhi]   = useState('');
  const [cmMsg, setCmMsg]         = useState('');
  const [folderEdit, setFolderEdit] = useState(folderId);

  const addCount = async () => {
    if (!newCount.trim() || !newKazhi) return;
    const formatted = autoFormatCount(newCount.trim());
    const u = [...countMap, { id:uid(), count:formatted, kazhi:Number(newKazhi) }];
    setCountMap(u); await api.storeSet('sgc-countmap', u);
    setNewCount(''); setNewKazhi('');
    setCmMsg(`✓ Added ${formatted}`); setTimeout(()=>setCmMsg(''), 2000);
  };

  const removeCount = async (id) => {
    const u = countMap.filter(c=>c.id!==id);
    setCountMap(u); await api.storeSet('sgc-countmap', u);
  };

  const saveFolderId = async () => {
    await api.storeSet('drive-folder-id', folderEdit);
    setFolderId(folderEdit);
    alert('Folder ID saved!');
  };

  return (
    <div>
      {/* Drive Connection */}
      <div style={{ ...S.section, borderColor:driveConnected?'rgba(52,168,83,0.4)':'rgba(255,107,107,0.3)' }}>
        <div style={{ ...S.secTitle, color:driveConnected?C.drive:C.red }}>Google Drive Connection</div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
          <div>
            <div style={{ fontSize:13, color:driveConnected?C.green:C.red, fontWeight:700, marginBottom:4 }}>
              {driveConnected ? '✅ Drive Connected — PDF upload ready!' : '❌ Drive not connected'}
            </div>
            <div style={{ fontSize:11, color:C.muted }}>
              {driveConnected ? 'Bills save pannum podhu PDF-aa automatically Drive la upload agum.' : 'Connect panna Drive Auth tab-la po.'}
            </div>
          </div>
          {driveConnected ? (
            <button style={{ ...S.btn('danger'), padding:'8px 16px' }} onClick={onDriveDisconnect}>Disconnect Drive</button>
          ) : (
            <button style={{ ...S.btn('drive'), padding:'8px 16px' }} onClick={onDriveConnect}>Connect Drive →</button>
          )}
        </div>
        {driveConnected && (
          <div style={{ marginTop:16, display:'flex', gap:10, alignItems:'flex-end', flexWrap:'wrap' }}>
            <div style={{ flex:1, minWidth:200 }}>
              <label style={S.label}>Drive Folder ID</label>
              <input style={S.input} value={folderEdit} onChange={e=>setFolderEdit(e.target.value)} placeholder="Google Drive Folder ID" />
            </div>
            <button style={S.btn('success')} onClick={saveFolderId}>Save</button>
          </div>
        )}
      </div>

      {/* Count Map */}
      <div style={S.section}>
        <div style={S.secTitle}>Count → Kazhi Mapping</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr auto auto', gap:10, alignItems:'flex-end', marginBottom:16 }}>
          <div><label style={S.label}>Count</label><input style={S.input} value={newCount} onChange={e=>setNewCount(e.target.value)} placeholder="17s" /></div>
          <div><label style={S.label}>Kazhi per Kattu</label><input style={S.input} type="number" value={newKazhi} onChange={e=>setNewKazhi(e.target.value)} placeholder="17" /></div>
          <button style={S.btn('primary')} onClick={addCount}>+ Add</button>
          {cmMsg && <span style={{ fontSize:12, color:C.green }}>{cmMsg}</span>}
        </div>
        <table style={{ width:'100%' }}>
          <thead><tr><th style={S.th}>Count</th><th style={S.th}>Kazhi / Kattu</th><th style={S.th}></th></tr></thead>
          <tbody>
            {countMap.map(cm=>(
              <tr key={cm.id}>
                <td style={{ ...S.td, fontWeight:700, color:C.gold }}>{cm.count}</td>
                <td style={S.td}>{cm.kazhi}</td>
                <td style={S.td}><button style={{ ...S.btn('danger'), padding:'4px 10px', fontSize:10 }} onClick={()=>removeCount(cm.id)}>Remove</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── CUSTOMERS PAGE ────────────────────────────────────────────────────────────
function CustomersPage({ customers, bills, setCustomers }) {
  const [nm, setNm]=useState(''), [gst, setGst]=useState(''), [search, setSearch]=useState('');
  const add = async () => {
    if (!nm.trim()) return;
    const u = [...customers, { id:uid(), name:nm.trim(), gst:gst.trim() }];
    setCustomers(u); await api.storeSet('sgc-customers', u); setNm(''); setGst('');
  };
  const remove = async (id) => {
    if (!confirm('Remove?')) return;
    const u = customers.filter(c=>c.id!==id);
    setCustomers(u); await api.storeSet('sgc-customers', u);
  };
  const filtered = customers.filter(c => !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.gst.toLowerCase().includes(search.toLowerCase()));
  return (
    <div>
      <div style={S.section}>
        <div style={S.secTitle}>Add New Customer</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:12, alignItems:'flex-end' }}>
          <div><label style={S.label}>Name</label><input style={S.input} value={nm} onChange={e=>setNm(e.target.value)} placeholder="Shop name" /></div>
          <div><label style={S.label}>GST</label><input style={S.input} value={gst} onChange={e=>setGst(e.target.value)} placeholder="33XXXXX..." /></div>
          <button style={S.btn('primary')} onClick={add}>+ Add</button>
        </div>
      </div>
      <div style={S.section}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div style={S.secTitle}>All Customers ({customers.length})</div>
          <input style={{ ...S.input, maxWidth:220 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search..." />
        </div>
        <table style={{ width:'100%' }}>
          <thead><tr><th style={S.th}>#</th><th style={S.th}>Name</th><th style={S.th}>GST</th><th style={S.th}>Bills</th><th style={S.th}></th></tr></thead>
          <tbody>
            {filtered.map((c,i) => {
              const cb = bills.filter(b=>b.customer===c.name);
              return (
                <tr key={c.id}>
                  <td style={{ ...S.td, color:C.muted, fontSize:11 }}>{i+1}</td>
                  <td style={{ ...S.td, fontWeight:700, color:C.gold }}>{c.name}</td>
                  <td style={{ ...S.td, fontSize:11, color:C.muted, fontFamily:'monospace' }}>{c.gst||'—'}</td>
                  <td style={S.td}><span style={S.badge(cb.length>0?'green':'orange')}>{cb.length} bills</span></td>
                  <td style={S.td}><button style={{ ...S.btn('danger'), padding:'4px 10px', fontSize:10 }} onClick={()=>remove(c.id)}>Remove</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]               = useState('dashboard');
  const [bills, setBills]           = useState([]);
  const [customers, setCustomers]   = useState(DEFAULT_CUSTOMERS);
  const [countMap, setCountMap]     = useState(DEFAULT_COUNT_MAP);
  const [driveConnected, setDrive]  = useState(false);
  const [folderId, setFolderId]     = useState('11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9');
  const [editBill, setEditBill]     = useState(null);
  const [loaded, setLoaded]         = useState(false);

  useEffect(() => {
    (async () => {
      const b  = await api.storeGet('sgc-bills');
      const c  = await api.storeGet('sgc-customers');
      const cm = await api.storeGet('sgc-countmap');
      const fi = await api.storeGet('drive-folder-id');
      if (b)  setBills(b);
      if (c)  setCustomers(c);
      if (cm) setCountMap(cm);
      if (fi) setFolderId(fi);
      const { connected } = await api.googleAuthStatus();
      setDrive(connected);
      setLoaded(true);
    })();
  }, []);

  const saveBill = async (bill) => {
    setBills(prev => {
      const exists = prev.find(b => b.id === bill.id);
      const updated = exists ? prev.map(b=>b.id===bill.id?bill:b) : [...prev, bill];
      api.storeSet('sgc-bills', updated);
      return updated;
    });
  };

  const handleDriveConnect = () => setTab('drive-auth');
  const handleDriveDisconnect = async () => {
    await api.googleAuthDisconnect();
    setDrive(false);
  };
  const handleConnected = () => {
    setDrive(true);
    setTab('dashboard');
  };

  if (!loaded) {
    return (
      <div style={{ ...S.app, display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontSize:32, marginBottom:12, animation:'spin 1s linear infinite', display:'inline-block' }}>⟳</div>
          <div style={{ color:C.muted, fontSize:13, letterSpacing:2 }}>LOADING...</div>
        </div>
      </div>
    );
  }

  const tabs = [
    ['dashboard', 'Dashboard'],
    ['new',       'New Bill'],
    ['bills',     'All Bills'],
    ['customers', 'Customers'],
    ['settings',  'Settings'],
  ];

  return (
    <div style={S.app}>
      <nav style={S.nav}>
        <div style={S.navBrand}>SGC Billing</div>
        {tabs.map(([v,l]) => (
          <button key={v} style={S.navTab(tab===v)} onClick={()=>{ setTab(v); if(v==='new') setEditBill(null); }}>{l}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8, padding:'8px 0' }}>
          <span style={S.badge(driveConnected?'drive':'orange')}>{driveConnected?'☁ Drive Ready':'⚠ Drive Offline'}</span>
        </div>
      </nav>
      <main style={S.main}>
        {tab==='dashboard'  && <Dashboard bills={bills} />}
        {tab==='new'        && <NewBillForm customers={customers} bills={bills} countMap={countMap} onSave={saveBill} editBill={editBill} driveConnected={driveConnected} />}
        {tab==='bills'      && <BillsList bills={bills} setBills={setBills} onSave={saveBill} />}
        {tab==='customers'  && <CustomersPage customers={customers} bills={bills} setCustomers={setCustomers} />}
        {tab==='settings'   && <SettingsPage countMap={countMap} setCountMap={setCountMap} driveConnected={driveConnected} onDriveConnect={handleDriveConnect} onDriveDisconnect={handleDriveDisconnect} folderId={folderId} setFolderId={setFolderId} />}
        {tab==='drive-auth' && <DriveAuthPage onConnected={handleConnected} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
