      </div>

      {/* Company Profile Settings */}
      <div style={S.section}>
        <div style={S.secTitle}>🏢 Company Profile & Bank Details</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
          <div><label style={S.label}>Company Name</label><input style={S.input} value={compEdit.name} onChange={e=>setCompEdit({...compEdit, name:e.target.value})} /></div>
          <div><label style={S.label}>GSTIN</label><input style={S.input} value={compEdit.gstin} onChange={e=>setCompEdit({...compEdit, gstin:e.target.value})} /></div>
          <div><label style={S.label}>Address</label><input style={S.input} value={compEdit.address} onChange={e=>setCompEdit({...compEdit, address:e.target.value})} /></div>
          <div><label style={S.label}>Contact / Phone</label><input style={S.input} value={compEdit.contact} onChange={e=>setCompEdit({...compEdit, contact:e.target.value})} /></div>
          <div><label style={S.label}>Bank Name</label><input style={S.input} value={compEdit.bankName} onChange={e=>setCompEdit({...compEdit, bankName:e.target.value})} /></div>
          <div><label style={S.label}>Account Number</label><input style={S.input} value={compEdit.accountNo} onChange={e=>setCompEdit({...compEdit, accountNo:e.target.value})} /></div>
          <div><label style={S.label}>IFSC Code</label><input style={S.input} value={compEdit.ifsc} onChange={e=>setCompEdit({...compEdit, ifsc:e.target.value})} /></div>
          <div><label style={S.label}>Jurisdiction City</label><input style={S.input} value={compEdit.jurisdiction} onChange={e=>setCompEdit({...compEdit, jurisdiction:e.target.value})} /></div>
        </div>
        <button style={S.btn('primary')} onClick={saveCompanyProfile}>💾 Save Company Profile</button>
      </div>
    </div>
  );
}

// ── GMAIL SYNC PAGE ──────────────────────────────────────────────────────────────
function GmailSyncPage({ company }) {
  const [status, setStatus] = useState('idle');
  const [message, setMessage] = useState('');
  const [foundCount, setFoundCount] = useState(0);
  const [authStep, setAuthStep] = useState(1);
  const [authCode, setAuthCode] = useState('');
  const [gmailConnected, setGmailConnected] = useState(false);

  useEffect(() => {
    (async () => {
      const res = await api.gmailAuthStatus();
      setGmailConnected(res.connected);
    })();
  }, []);

  const handleGmailAuthStart = async () => {
    const res = await api.gmailAuthStart();
    if (res.success) {
      setMessage('✅ Browser opened. Login and paste the auth code below.');
      setAuthStep(2);
    } else {
      setMessage(`❌ ${res.error}`);
    }
  };

  const handleGmailAuthExchange = async () => {
    if (!authCode.trim()) { setMessage('❌ Enter auth code'); return; }
    const res = await api.gmailAuthExchange(authCode);
    if (res.success) {
      setGmailConnected(true);
      setMessage('✅ Gmail connected!');
    } else {
      setMessage(`❌ ${res.error}`);
    }
  };

  const handleGmailDisconnect = async () => {
    await api.gmailAuthDisconnect();
    setGmailConnected(false);
    setAuthStep(1);
    setMessage('');
  };

  const handleScanEmails = async () => {
    setStatus('scanning');
    setMessage('');
    try {
      const res = await api.gmailScan({ label: 'SGC-Billing', maxResults: 50 });
      if (res.success) {
        setFoundCount(res.count || 0);
        setStatus('connected');
        setMessage(res.message || `✅ Scanned ${res.count || 0} bills.`);
      } else {
        setStatus('error');
        setMessage(`❌ ${res.error || 'Scan failed'}`);
      }
    } catch (err) {
      setStatus('error');
      setMessage(`❌ ${err.message}`);
    }
  };

  return (
    <div className="fade-in" style={{ maxWidth: 680, margin: '40px auto' }}>
      <div style={S.section}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
          <span style={{ fontSize: 24 }}>📥</span>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.text }}>Gmail Bill Scanner</div>
            <div style={{ fontSize: 11, color: C.textMuted, letterSpacing: 1 }}>
              Auto-scan Gmail for bills labeled "SGC-Billing" and extract bill data
            </div>
          </div>
        </div>

        {/* Gmail Auth Status */}
        <div style={{ marginBottom: 16 }}>
          {gmailConnected ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ color: C.green, fontWeight: 700 }}>✅ Gmail Connected</span>
              <button style={{ ...S.btn('danger'), padding: '4px 10px', fontSize: 10 }} onClick={handleGmailDisconnect}>Disconnect</button>
            </div>
          ) : (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ color: C.red, fontWeight: 700 }}>⚠ Gmail not connected</span>
              <button style={S.btn('drive')} onClick={handleGmailAuthStart}>Connect Gmail →</button>
            </div>
          )}
        </div>

        {/* Auth Code Input (Step 2) */}
        {authStep === 2 && !gmailConnected && (
          <div style={{ background: 'rgba(255,200,74,0.06)', border: `1px solid ${C.gold}33`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 11, color: C.gold, fontWeight: 700, letterSpacing: 1.5, marginBottom: 8 }}>STEP 2 — Paste Auth Code</div>
            <input style={S.input} value={authCode} onChange={(e) => setAuthCode(e.target.value)} placeholder="Paste Google auth code here..." />
            <button style={{ ...S.btn('success'), marginTop: 10, padding: '8px 16px' }} onClick={handleGmailAuthExchange}>✓ Complete Connection</button>
          </div>
        )}

        {message && (
          <div style={{ padding: 12, background: message.startsWith('✅') ? 'rgba(78,217,122,0.08)' : 'rgba(255,107,107,0.08)', borderRadius: 10, marginBottom: 14, fontSize: 12, color: message.startsWith('✅') ? C.green : C.red }}>
            {message}
          </div>
        )}

        {/* Scan Button */}
        {gmailConnected && (
          <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
            <button style={{ ...S.btn('primary'), padding: '10px 20px' }} onClick={handleScanEmails} disabled={status === 'scanning'}>
              {status === 'scanning' ? '⟳ Scanning...' : '🚀 Scan Gmail for Bills'}
            </button>
            {foundCount > 0 && (
              <span style={{ fontSize: 11, color: C.textMuted }}>
                {foundCount} bill(s) found with "SGC-Billing" label
              </span>
            )}
          </div>
        )}

        {!gmailConnected && (
          <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.6, marginTop: 12 }}>
            Connect your Gmail to auto-scan emails labeled <b>"SGC-Billing"</b> and extract bill details directly into your billing system.
          </div>
        )}
      </div>
    </div>
  );
}

// ── DRIVE AUTH PAGE ───────────────────────────────────────────────────────────
function DriveAuthPage({ onConnected }) {
  const [step, setStep]         = useState(1);
  const [authCode, setAuthCode] = useState('');
  const [msg, setMsg]           = useState('');
  const [loading, setLoading]   = useState(false);
  const fileRef = useRef(null);

  const handleFileUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      if (!json.installed) { setMsg('❌ Wrong file — "installed" key not found in client_secret.json!'); return; }
      setLoading(true);
      const res = await api.googleAuthStart(json);
      if (res.success) {
        setMsg('✅ Browser opened for Google login. Login and paste the auth code here.');
        setStep(2);
      } else {
        setMsg(`❌ Error: ${res.error}`);
      }
    } catch (err) {
      setMsg(`❌ JSON parse error: ${err.message}`);
    } finally {
      setLoading(false);
    }
  };

  const handleCodeSubmit = async () => {
    if (!authCode.trim()) { setMsg('❌ Enter Google Auth Code!'); return; }
    setLoading(true);
    try {
      const res = await api.googleAuthExchange(authCode);
      if (res.success) {
        setMsg('✅ Connected! Google Drive is ready.');
        setStep(3);
        setTimeout(() => onConnected(), 1200);
      } else {
        setMsg(`❌ ${res.error}`);
      }
    } catch (err) {
      setMsg(`❌ ${err.message}`);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="fade-in" style={{ maxWidth:580, margin:'40px auto' }}>
      <div style={S.section}>
        <div style={{ fontSize:36, marginBottom:12, textAlign:'center' }}>☁</div>
        <div style={{ fontSize:20, fontWeight:800, color:C.gold, textAlign:'center', marginBottom:8 }}>Connect Google Drive</div>
        <div style={{ fontSize:12, color:C.textMuted, textAlign:'center', marginBottom:26 }}>
          One-time authentication to automatically sync your PDF bills to Google Drive.
        </div>

        <div style={{ background: step===1?'rgba(255,200,74,0.08)':'rgba(255,255,255,0.02)', border:`1px solid ${step===1?C.gold+'44':'rgba(255,255,255,0.08)'}`, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:11, color:step===1?C.gold:C.textMuted, fontWeight:700, letterSpacing:1.5, marginBottom:8 }}>STEP 1 — Upload client_secret.json</div>
          {step === 1 ? (
            <>
              <p style={{ fontSize:12, color:C.textMuted, marginBottom:12 }}>Select your downloaded <b style={{ color:C.text }}>client_secret_*.json</b> file from Google Cloud Console.</p>
              <input ref={fileRef} type="file" accept=".json" style={{ display:'none' }} onChange={handleFileUpload} />
              <button style={S.btn('primary')} onClick={()=>fileRef.current.click()} disabled={loading}>
                {loading ? '⟳ Processing...' : '📂 Choose JSON Secret'}
              </button>
            </>
          ) : (
            <div style={{ color:C.green, fontSize:12 }}>✅ Client Secret loaded</div>
          )}
        </div>

        <div style={{ background: step===2?'rgba(255,200,74,0.08)':'rgba(255,255,255,0.02)', border:`1px solid ${step===2?C.gold+'44':'rgba(255,255,255,0.08)'}`, borderRadius:10, padding:16, marginBottom:14 }}>
          <div style={{ fontSize:11, color:step>=2?C.gold:C.textMuted, fontWeight:700, letterSpacing:1.5, marginBottom:8 }}>STEP 2 — Enter Verification Code</div>
          {step === 2 && (
            <>
              <p style={{ fontSize:12, color:C.textMuted, marginBottom:12 }}>Authorize in the browser window and paste the code below:</p>
              <input style={{ ...S.input, marginBottom:10 }} value={authCode} onChange={e=>setAuthCode(e.target.value)} placeholder="4/0AX4XfWi..." />
              <button style={S.btn('success')} onClick={handleCodeSubmit} disabled={loading}>
                {loading ? '⟳ Verifying...' : '✓ Complete Drive Connection'}
              </button>
            </>
          )}
          {step > 2 && <div style={{ color:C.green, fontSize:12 }}>✅ Auth code verified</div>}
          {step < 2 && <div style={{ color:C.textMuted, fontSize:12 }}>— Waiting for Step 1</div>}
        </div>

        {msg && (
          <div style={{ marginTop:14, padding:'10px 14px', background:'rgba(255,255,255,0.05)', borderRadius:8, fontSize:12, color:msg.startsWith('✅')?C.green:C.red }}>
            {msg}
          </div>
        )}
      </div>
    </div>
  );
}

// ── ROOT APP COMPONENT ────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]               = useState('dashboard');
  const [bills, setBills]           = useState([]);
  const [customers, setCustomers]   = useState(DEFAULT_CUSTOMERS);
  const [countMap, setCountMap]     = useState(DEFAULT_COUNT_MAP);
  const [company, setCompany]       = useState(DEFAULT_COMPANY);
  const [driveConnected, setDrive]  = useState(false);
  const [folderId, setFolderId]     = useState('11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9');
  const [editBill, setEditBill]     = useState(null);
  const [ledgerCustomer, setLedger] = useState(null);
  const [loaded, setLoaded]         = useState(false);
  const [syncingAll, setSyncingAll] = useState(false);

  useEffect(() => {
    (async () => {
      const b   = await api.storeGet('sgc-bills');
      const c   = await api.storeGet('sgc-customers');
      const cm  = await api.storeGet('sgc-countmap');
      const fi  = await api.storeGet('drive-folder-id');
      const comp = await api.storeGet('sgc-company-profile');
      if (b)    setBills(b);
      if (c)    setCustomers(c);
      if (cm)   setCountMap(cm);
      if (fi)   setFolderId(fi);
      if (comp) setCompany(comp);
      const { connected } = await api.googleAuthStatus();
      setDrive(connected);
      setLoaded(true);
    })();
  }, []);

  const saveBill = async (bill) => {
    setBills(prev => {
      const exists = prev.find(b => b.id === bill.id);
      const updated = exists ? prev.map(b => b.id === bill.id ? bill : b) : [...prev, bill];
      api.storeSet('sgc-bills', updated);
      return updated;
    });
  };

  const handleEditBill = (bill) => {
    setEditBill(bill);
    setTab('new');
  };

  const handleCloneBill = (bill) => {
    const nextNo = bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
    const cloned = {
      ...bill,
      id: uid(),
      billNo: nextNo,
      date: today(),
      status: 'pending',
      payments: [],
      driveUrl: null,
      driveFileId: null,
      items: (bill.items || []).map(it => ({ ...it, id: uid() })),
    };
    setEditBill(cloned);
    setTab('new');
  };

  const handleDriveConnect = () => setTab('drive-auth');
  const handleDriveDisconnect = async () => {
    await api.googleAuthDisconnect();
    setDrive(false);
  };
  const handleConnected = () => {
    setDrive(true);
    setTab('dashboard');
  };

  const syncAllBills = async () => {
    if (!driveConnected) return;
    setSyncingAll(true);
    const payload = bills.map(b => ({ billData: b, htmlContent: generateBillHTML(b, company) }));
    const res = await api.syncAllBills({ billPayloads: payload });
    setSyncingAll(false);
    if (res.success) {
      const s = res.summary;
      const updated = bills.map(b => {
        const r = s.results.find(x => Number(x.billNo) === Number(b.billNo));
        if (r && r.success) return { ...b, driveUrl: r.driveUrl, driveFileId: r.fileId, vaultFiles: r.vaultFiles };
        return b;
      });
      setBills(updated);
      await api.storeSet('sgc-bills', updated);
      alert(`✅ Drive sync complete!\n${s.synced}/${s.total} bills uploaded (${s.updated} updated in place, ${s.failed} failed).`);
    } else {
      alert(`❌ Sync failed: ${res.error}`);
    }
  };

  if (!loaded) {
    return (
      <div style={{ ...S.app, display:'flex', alignItems:'center', justifyContent:'center', minHeight:'100vh' }}>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontSize:36, marginBottom:14, animation:'spin 1s linear infinite', display:'inline-block' }}>⟳</div>
          <div style={{ color:C.gold, fontSize:13, letterSpacing:3, fontWeight:700 }}>LOADING SGC BILLING...</div>
        </div>
      </div>
    );
  }

  const tabs = [
    ['dashboard', 'Dashboard'],
    ['new',       editBill ? 'Edit Bill ✎' : 'New Bill +'],
    ['bills',     'All Bills'],
    ['gmail-sync', '📥 GMAIL SYNC'],
    ['customers', 'Customers'],
    ['analytics', 'Analytics & Reports'],
    ['settings',  'Settings'],
  ];

  return (
    <div style={S.app}>
      <nav style={S.nav}>
        <div style={S.navBrand}>
          <span style={{ fontSize:18 }}>⚡</span> SGC Billing
        </div>
        {tabs.map(([v,l]) => (
          <button key={v} style={S.navTab(tab===v)} onClick={()=>{
            setTab(v);
            if (v === 'new' && !editBill) setEditBill(null);
          }}>{l}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:10, padding:'10px 0' }}>
          <button
            style={{ ...S.btn('drive'), padding:'5px 12px', fontSize:11, display:'flex', alignItems:'center', gap:5, cursor:'pointer' }}
            onClick={()=>api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9?usp=drive_link')}
            title="Open Mukil's Master Main Bills Drive Vault">
            📁 Main Drive Bills ↗
          </button>
          <span style={S.badge(driveConnected?'drive':'orange')}>
            {driveConnected ? '☁ Drive Connected' : '⚠ Drive Offline'}
          </span>
        </div>
      </nav>

      <main style={S.main}>
        {tab==='dashboard'  && <Dashboard bills={bills} onNewBill={()=>{ setEditBill(null); setTab('new'); }} onShowLedger={c=>setLedger(c)} customers={customers} company={company} />}
        {tab==='new'        && <NewBillForm customers={customers} bills={bills} countMap={countMap} onSave={saveBill} editBill={editBill} onCancelEdit={()=>{ setEditBill(null); setTab('bills'); }} driveConnected={driveConnected} company={company} />}
        {tab==='bills'      && <BillsList bills={bills} setBills={setBills} onEditBill={handleEditBill} onCloneBill={handleCloneBill} customers={customers} company={company} />}
        {tab==='customers'  && <CustomersPage customers={customers} bills={bills} setCustomers={setCustomers} onShowLedger={c=>setLedger(c)} />}
        {tab==='analytics'  && <AnalyticsPage bills={bills} customers={customers} />}
        {tab==='settings'   && <SettingsPage countMap={countMap} setCountMap={setCountMap} driveConnected={driveConnected} onDriveConnect={handleDriveConnect} onDriveDisconnect={handleDriveDisconnect} folderId={folderId} setFolderId={setFolderId} company={company} setCompany={setCompany} bills={bills} setBills={setBills} customers={customers} setCustomers={setCustomers} syncingAll={syncingAll} syncAllBills={syncAllBills} />}
        {tab==='gmail-sync' && <GmailSyncPage company={company} />}
        {tab==='drive-auth' && <DriveAuthPage onConnected={handleConnected} />}
      </main>

      {ledgerCustomer && (
        <CustomerLedgerModal customer={ledgerCustomer} bills={bills} onClose={()=>setLedger(null)} onEditBill={handleEditBill} company={company} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
