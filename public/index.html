function App() {
  const [tab, setTab]               = useState('dashboard');
  const [bills, setBills]           = useState([]);
  const [customers, setCustomers]   = useState(DEFAULT_CUSTOMERS);
  const [countMap, setCountMap]     = useState(DEFAULT_COUNT_MAP);
  const [company, setCompany]       = useState(DEFAULT_COMPANY);
  const [driveConnected, setDrive]  = useState(false);
  const [folderId, setFolderId]     = useState('11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9');
  const [editBill, setEditBill]     = useState(null);
  const [ledgerCustomer, setLedger] = useState(null);
  const [loaded, setLoaded]         = useState(false);
  const [videoDone, setVideoDone]   = useState(false);
  const [videoProgress, setVideoProgress] = useState(0);
  const [syncingAll, setSyncingAll] = useState(false);
  const [showMonthEnd, setShowMonthEnd] = useState(false);

  useEffect(() => {
    (async () => {
      const b   = await api.storeGet('sgc-bills');
      const c   = await api.storeGet('sgc-customers');
      const cm  = await api.storeGet('sgc-countmap');
      const fi  = await api.storeGet('drive-folder-id');
      const comp = await api.storeGet('sgc-company-profile');
      if (b)    setBills(b);
      if (c)    setCustomers(c);
      if (cm)   setCountMap(cm);
      if (fi)   setFolderId(fi);
      if (comp) setCompany(comp);
      const { connected } = await api.googleAuthStatus();
      setDrive(connected);
      if (connected && api.ensureMonthFolder) {
        api.ensureMonthFolder().catch(() => {});
      }
      setLoaded(true);
    })();

    if (api.onBillsUpdated) {
      api.onBillsUpdated((newBills) => setBills(newBills));
    }
  }, []);

  const saveBill = async (bill) => {
    setBills(prev => {
      const exists = prev.find(b => b.id === bill.id);
      const updated = exists ? prev.map(b => b.id === bill.id ? bill : b) : [...prev, bill];
      api.storeSet('sgc-bills', updated);
      return updated;
    });
  };

  const handleDeleteBill = async (id) => {
    const billToDelete = bills.find(b => b.id === id);
    if (!billToDelete) return;
    if (!confirm(`Are you sure you want to delete Bill #${billToDelete.billNo} (${billToDelete.customer})?\n\nThis will also permanently delete the PDF file from Google Drive vaults.`)) return;

    // 1. Remove from Drive vaults unconditionally across all file IDs and bill numbers
    if (billToDelete.driveFileId || billToDelete.vaultFiles || billToDelete.billNo) {
      try {
        const driveDelRes = await api.deleteBillFromDrive({ billData: billToDelete });
        if (driveDelRes && driveDelRes.success) {
          console.log(`[DRIVE] Successfully deleted Bill #${billToDelete.billNo} from Drive vaults:`, driveDelRes.deleted);
        } else {
          console.warn(`[DRIVE] Drive delete response:`, driveDelRes);
        }
      } catch (err) {
        console.warn('Failed to delete bill from drive:', err);
      }
    }

    // 2. Remove from local bills list
    const u = bills.filter(b => b.id !== id);
    setBills(u);
    await api.storeSet('sgc-bills', u);
  };

  const handleEditBill = (bill) => {
    setEditBill(bill);
    setTab('new');
  };

  const handleCloneBill = (bill) => {
    const nextNo = bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
    const cloned = {
      ...bill,
      id: uid(),
      billNo: nextNo,
      date: today(),
      status: 'pending',
      payments: [],
      driveUrl: null,
      driveFileId: null,
      items: (bill.items || []).map(it => ({ ...it, id: uid() })),
    };
    setEditBill(cloned);
    setTab('new');
  };

  const handleDriveConnect = () => setTab('drive-auth');
  const handleDriveDisconnect = async () => {
    await api.googleAuthDisconnect();
    setDrive(false);
  };
  const handleConnected = () => {
    setDrive(true);
    setTab('dashboard');
  };

  const syncAllBills = async () => {
    if (!driveConnected) return;
    setSyncingAll(true);
    const payload = bills.map(b => ({ billData: b, htmlContent: generateBillHTML(b, company) }));
    const res = await api.syncAllBills({ billPayloads: payload });
    setSyncingAll(false);
    if (res.success) {
      const s = res.summary;
      const updated = bills.map(b => {
        const r = s.results.find(x => Number(x.billNo) === Number(b.billNo));
        if (r && r.success) return { ...b, driveUrl: r.driveUrl, driveFileId: r.fileId, vaultFiles: r.vaultFiles };
        return b;
      });
      setBills(updated);
      await api.storeSet('sgc-bills', updated);
      alert(`✅ Drive sync complete!\n${s.synced}/${s.total} bills uploaded (${s.updated} updated in place, ${s.failed} failed).`);
    } else {
      alert(`❌ Sync failed: ${res.error}`);
    }
  };

  if (!loaded || !videoDone) {
    return (
      <div style={{ position:'fixed', inset:0, background:'#06070d', zIndex:9999, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:20 }}>
        <div style={{ position:'relative', width:'100%', maxWidth:760, borderRadius:16, overflow:'hidden', boxShadow:'0 0 60px rgba(0,210,255,0.2), 0 20px 60px rgba(0,0,0,0.9)', border:'1px solid rgba(255,200,74,0.3)', background:'#000' }}>
          <video
            src="loading_video.mp4"
            autoPlay
            muted
            playsInline
            onTimeUpdate={(e) => {
              if (e.target.duration) {
                setVideoProgress((e.target.currentTime / e.target.duration) * 100);
              }
            }}
            onEnded={() => setVideoDone(true)}
            onError={() => setVideoDone(true)}
            style={{ width:'100%', height:'auto', display:'block', maxHeight:'75vh', objectFit:'contain' }}
          />
          {/* Top Bar with Brand and Skip */}
          <div style={{ position:'absolute', top:12, left:16, right:16, display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:10 }}>
            <div style={{ fontSize:11, letterSpacing:2.5, fontWeight:800, color:'#38bdf8', textShadow:'0 2px 8px rgba(0,0,0,0.8)', display:'flex', alignItems:'center', gap:6, background:'rgba(11,15,25,0.8)', padding:'4px 12px', borderRadius:20, border:'1px solid rgba(255,255,255,0.1)' }}>
              <span style={{ animation:'spin 2s linear infinite', display:'inline-block' }}>⚡</span> SRI GANAPATHI COLOURS
            </div>
            <button
              onClick={() => setVideoDone(true)}
              style={{ background:'rgba(11,15,25,0.8)', border:'1px solid rgba(255,255,255,0.2)', color:'#fff', padding:'5px 14px', borderRadius:20, fontSize:11, cursor:'pointer', fontWeight:600, backdropFilter:'blur(4px)', transition:'all 0.2s' }}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(37,99,235,0.6)'}
              onMouseLeave={e=>e.currentTarget.style.background='rgba(11,15,25,0.8)'}
            >
              Skip Intro ➔
            </button>
          </div>
          {/* Bottom Progress Line */}
          <div style={{ position:'absolute', bottom:0, left:0, right:0, height:3, background:'rgba(255,255,255,0.08)' }}>
            <div style={{ height:'100%', width:`${videoProgress}%`, background:'linear-gradient(90deg, #2563eb, #38bdf8)', transition:'width 0.1s linear' }} />
          </div>
        </div>
        <div style={{ marginTop:16, fontSize:11, letterSpacing:2.5, color:'#94a3b8', fontWeight:700, display:'flex', alignItems:'center', gap:8 }}>
          <span>INITIALIZING SGC BILLING SYSTEM</span>
          <span style={{ fontSize:10, color:'#38bdf8' }}>({Math.round(videoProgress)}%)</span>
        </div>
      </div>
    );
  }

  const tabs = [
    ['dashboard', 'Dashboard'],
    ['new',       editBill ? 'Edit Bill ✎' : 'New Bill +'],
    ['bills',     'All Bills'],
    ['gmail-sync', '📥 GMAIL SYNC'],
    ['customers', 'Customers'],
    ['analytics', 'Analytics & Reports'],
    ['settings',  'Settings'],
  ];

  return (
    <div style={S.app}>
      <nav style={S.nav}>
        <div style={S.navBrand}>
          <span style={{ fontSize:18 }}>⚡</span> SGC Billing
        </div>
        {tabs.map(([v,l]) => (
          <button key={v} style={S.navTab(tab===v)} onClick={()=>{
            setTab(v);
            if (v === 'new' && !editBill) setEditBill(null);
          }}>{l}</button>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:10, padding:'10px 0' }}>
          <button
            style={{ ...S.btn('drive'), padding:'5px 12px', fontSize:11, display:'flex', alignItems:'center', gap:5, cursor:'pointer' }}
            onClick={()=>api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9?usp=drive_link')}
            title="Open Mukil's Master Main Bills Drive Vault">
            📁 Main Drive Bills ↗
          </button>
          <span style={S.badge(driveConnected?'drive':'orange')}>
            {driveConnected ? '☁ Drive Connected' : '⚠ Drive Offline'}
          </span>
        </div>
      </nav>

      <main style={S.main}>
        {tab==='dashboard'  && <Dashboard bills={bills} onNewBill={()=>{ setEditBill(null); setTab('new'); }} onShowLedger={c=>setLedger(c)} customers={customers} company={company} onDeleteBill={handleDeleteBill} onShowMonthEnd={()=>setShowMonthEnd(true)} />}
        {tab==='new'        && <NewBillForm customers={customers} bills={bills} countMap={countMap} onSave={saveBill} editBill={editBill} onCancelEdit={()=>{ setEditBill(null); setTab('bills'); }} driveConnected={driveConnected} company={company} />}
        {tab==='bills'      && <BillsList bills={bills} setBills={setBills} onEditBill={handleEditBill} onCloneBill={handleCloneBill} customers={customers} company={company} onDeleteBill={handleDeleteBill} />}
        {tab==='customers'  && <CustomersPage customers={customers} bills={bills} setCustomers={setCustomers} onShowLedger={c=>setLedger(c)} />}
        {tab==='analytics'  && <AnalyticsPage bills={bills} customers={customers} />}
        {tab==='settings'   && <SettingsPage countMap={countMap} setCountMap={setCountMap} driveConnected={driveConnected} onDriveConnect={handleDriveConnect} onDriveDisconnect={handleDriveDisconnect} folderId={folderId} setFolderId={setFolderId} company={company} setCompany={setCompany} bills={bills} setBills={setBills} customers={customers} setCustomers={setCustomers} syncingAll={syncingAll} syncAllBills={syncAllBills} />}
        {tab==='gmail-sync' && <GmailSyncPage company={company} />}
        {tab==='drive-auth' && <DriveAuthPage onConnected={handleConnected} />}
      </main>

      {ledgerCustomer && (
        <CustomerLedgerModal customer={ledgerCustomer} bills={bills} onClose={()=>setLedger(null)} onEditBill={handleEditBill} company={company} />
      )}
      {showMonthEnd && (
        <MonthEndModal bills={bills} company={company} onClose={()=>setShowMonthEnd(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
