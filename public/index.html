  storeSet: async (k, v) => { localStorage.setItem(k, JSON.stringify(v)); },
   saveAndUploadBill: async ({ billData }) => ({ success: true, browserSaved: true, message: 'Saved in local storage' }),
  syncAllBills: async ({ billPayloads }) => ({ success: true, summary: { total: billPayloads.length, synced: billPayloads.length, updated: 0, failed: 0, results: [] } }),

  gmailAuthExchange: async () => ({ success: false, error: 'Gmail auth requires Electron desktop app' }),
  gmailAuthStatus: async () => ({ connected: false }),
  gmailAuthDisconnect: async () => ({ success: true }),
  gmailScan: async () => ({ success: false, error: 'Gmail sync requires Electron desktop app' }),
   saveLocalPdf: async ({ billData, htmlContent }) => {
    const printWin = window.open('', '_blank', 'width=900,height=800');
    if (printWin) {
      printWin.document.open();
      printWin.document.write(htmlContent);
      printWin.document.close();
      setTimeout(() => { printWin.focus(); printWin.print(); }, 300);
      return { success: true };
    }
    return { success: false, error: 'Popup blocked' };
  },
  organizeDriveBills: async () => ({ success: true, report: { total: 0, moved: 0, alreadyInPlace: 0 } }),
  exportFile: async ({ defaultName, content, extension }) => {
    const blob = new Blob([content], { type: extension === 'json' ? 'application/json' : 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = defaultName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return { success: true };
  },
  importFile: async () => {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return resolve({ success: false, canceled: true });
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          resolve({ success: true, data, fileName: file.name });
        } catch (err) {
          resolve({ success: false, error: err.message });
        }
      };
      input.click();
    });
  },

function numWords(n) {
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  n = Math.round(n);
  if (n === 0) return 'Zero';
  if (n < 20)  return a[n];
  if (n < 100) return b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '');
  if (n < 1000) return a[Math.floor(n/100)]+' Hundred'+(n%100 ? ' '+numWords(n%100) : '');
  if (n < 100000) return numWords(Math.floor(n/1000))+' Thousand'+(n%1000 ? ' '+numWords(n%1000) : '');
  if (n < 10000000) return numWords(Math.floor(n/100000))+' Lakh'+(n%100000 ? ' '+numWords(n%100000) : '');
  return numWords(Math.floor(n/10000000))+' Crore'+(n%10000000 ? ' '+numWords(n%10000000) : '');
}

function calcAmount(kattu, kazhi, rate, count, countMap) {
  const k  = Number(kattu) || 0;
  const kz = Number(kazhi) || 0;
  const r  = Number(rate)  || 0;
  if (r === 0 || (k === 0 && kz === 0)) return 0;
  if (k === 0) return kz * r;
  if (kz === 0) return k * r;
  const countKey = (count || '').toString().trim().toLowerCase();
  const mapping  = (countMap || DEFAULT_COUNT_MAP).find(m => m.count.toLowerCase() === countKey);
  if (!mapping || !Number(mapping.kazhi)) return k * r + kz * r;
  return (k * r) + (kz * (r / Number(mapping.kazhi)));
}

function getEffective(items, idx, field) {
  for (let i = idx; i >= 0; i--) {
    if ((items[i][field] || '').toString().trim() !== '') return items[i][field];
  }
  return '';
}

function autoFormatCount(raw) {
  const v = (raw || '').trim();
  if (!v) return v;
  if (v.toLowerCase().endsWith('s')) return v;
  if (/^[\d/]+$/.test(v)) return v + 's';
  return v;
}

function getBillFinancials(bill) {
  const net = Number(bill.netAmount || 0);
  let totalPaid = 0;
  if (bill.payments && Array.isArray(bill.payments) && bill.payments.length > 0) {
    totalPaid = bill.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  } else if (bill.status === 'paid') {
    totalPaid = net;
  }
  const balance = Math.max(0, net - totalPaid);
  let computedStatus = 'pending';
  if (totalPaid >= net && net > 0) {
    computedStatus = 'paid';
  } else if (totalPaid > 0) {
    computedStatus = 'partial';
  }
  return { totalPaid, balance, computedStatus };
}

// ── WHATSAPP SHARE URL GENERATOR ─────────────────────────────────────────────
function getWhatsAppShareUrl(bill, phone = '', driveUrl = '') {
  const cleanPhone = (phone || '').replace(/\D/g, '');
  const phoneParam = cleanPhone.length >= 10 ? `91${cleanPhone.slice(-10)}` : '';
  const fin = getBillFinancials(bill);
  const statusStr = fin.computedStatus === 'paid' ? 'PAID ✓' : (fin.computedStatus === 'partial' ? `PARTIAL (Paid: ₹${fin.totalPaid.toLocaleString('en-IN')})` : 'PENDING');
  
  const textLines = [
    `🧾 *SRI GANAPATHI COLOURS — GST INVOICE*`,
    `━━━━━━━━━━━━━━━━━━━━━━`,
    `*Bill No:* #${bill.billNo}`,
    `*Date:* ${bill.date}`,
    `*Customer:* ${bill.customer}`,
    bill.partyGst ? `*Party GST:* ${bill.partyGst}` : '',
    `*Net Amount:* ₹${Number(bill.netAmount||0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}`,
    `*Payment Status:* ${statusStr}`,
    fin.balance > 0 ? `*Balance Due:* ₹${Number(fin.balance).toLocaleString('en-IN', { minimumFractionDigits: 2 })}` : '',
    `━━━━━━━━━━━━━━━━━━━━━━`,
    `🏦 *Bank Details for Payment:*`,
    `Bank: CSB BANK`,
    `A/c No: 003204157368195001`,
    `IFSC: CSBK0000032`,
    driveUrl || bill.driveUrl ? `\n📄 *Download PDF:* ${driveUrl || bill.driveUrl}` : '',
    `\n_Thank you for your business!_`
  ].filter(Boolean).join('\n');

  return phoneParam
    ? `https://wa.me/${phoneParam}?text=${encodeURIComponent(textLines)}`
    : `https://wa.me/?text=${encodeURIComponent(textLines)}`;
}

// ── EXPORT BILLS TO CSV (GSTR-1 COMPLIANT FORMAT) ────────────────────────────
function exportBillsToCSV(bills) {
  const headers = [
    "Sl No", "Invoice Date", "Invoice No", "Customer Name", "Customer GSTIN",
    "HSN/SAC", "Total Kattu", "Total Kazhi", "Taxable Amount (Subtotal)",
    "CGST Rate", "CGST Amount", "SGST Rate", "SGST Amount", "Round Off",
    "Invoice Net Amount", "Payment Status", "Paid Amount", "Balance Due",
    "Drive PDF Link"
  ];

  const rows = bills.map((b, i) => {
    const fin = getBillFinancials(b);
    const totalKattu = (b.items||[]).reduce((s,it)=>s+Number(it.kattu||0),0);
    const totalKazhi = (b.items||[]).reduce((s,it)=>s+Number(it.kazhi||0),0);
    return [
      i + 1,
      `"${b.date || ''}"`,
      `"${b.billNo || ''}"`,
      `"${(b.customer || '').replace(/"/g, '""')}"`,
      `"${(b.partyGst || '').replace(/"/g, '""')}"`,
      '"9988"',
      totalKattu,
      totalKazhi,
      fmt(b.subtotal),
      "2.50%",
      fmt(b.cgst),
      "2.50%",
      fmt(b.sgst),
      fmt(b.netAmount - (b.subtotal + b.cgst + b.sgst)),
      fmt(b.netAmount),
      `"${fin.computedStatus.toUpperCase()}"`,
      fmt(fin.totalPaid),
      fmt(fin.balance),
      `"${b.driveUrl || ''}"`
    ].join(',');
  });

  return "\uFEFF" + [headers.join(','), ...rows].join('\r\n');
}

// ── AUTOCOMPLETE MODAL / DROPDOWN ────────────────────────────────────────────
function AutocompleteInput({ value, options, onChange, onSelect, placeholder, style, renderItem }) {
  const [open, setOpen] = useState(false);
  const [filtered, setFiltered] = useState([]);
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const handleChange = (val) => {
    onChange(val);
    if (!val.trim()) { setFiltered([]); setOpen(false); return; }
    const f = options.filter(opt => {
      const text = typeof opt === 'string' ? opt : (opt.name || opt.count || '');
      return text.toLowerCase().includes(val.toLowerCase());
    }).slice(0, 8);
    setFiltered(f);
    setOpen(f.length > 0);
  };

  return (
    <div ref={ref} style={{ position:'relative', width:'100%' }}>
      <input style={style} value={value} onChange={e=>handleChange(e.target.value)}
        onFocus={()=>{ if (value.trim() && filtered.length > 0) setOpen(true); }}
        placeholder={placeholder} autoComplete="off" />
      {open && (
        <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:200, background:'#121422', border:'1px solid rgba(59,130,246,0.5)', borderRadius:8, boxShadow:'0 10px 30px rgba(0,0,0,0.8)', marginTop:4, maxHeight:220, overflowY:'auto' }}>
          {filtered.map((item, i) => (
            <div key={i} onMouseDown={()=>{ onSelect(item); setOpen(false); setFiltered([]); }}
              style={{ padding:'9px 12px', cursor:'pointer', borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.05)':'none', transition:'background 0.1s' }}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(59,130,246,0.2)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              {renderItem ? renderItem(item) : (
                <div style={{ fontSize:13, color:'#e8f0ff', fontWeight:600 }}>{typeof item === 'string' ? item : item.name}</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      `*Outstanding Balance:* ₹${balanceDue.toLocaleString('en-IN', {minimumFractionDigits:2})}`,
      `━━━━━━━━━━━━━━━━━━━━━━━━━`,
      `🏦 *Bank Details:*`,
      `CSB BANK | A/c: 003204157368195001 | IFSC: CSBK0000032`,
      `\n_Kindly arrange payment for pending dues. Thank you!_`
    ].filter(Boolean).join('\n');

    const cleanPhone = (customer.phone || '').replace(/\D/g, '');
    const url = cleanPhone.length >= 10
      ? `https://wa.me/91${cleanPhone.slice(-10)}?text=${encodeURIComponent(lines)}`
      : `https://wa.me/?text=${encodeURIComponent(lines)}`;
    api.openExternal(url);
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:320, display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div className="fade-in" style={{ background:'#121422', border:'1px solid rgba(255,200,74,0.3)', borderRadius:18, padding:28, width:'100%', maxWidth:920, maxHeight:'90vh', overflowY:'auto', boxShadow:'0 25px 70px rgba(0,0,0,0.8)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20, flexWrap:'wrap', gap:12 }}>
          <div>
            <div style={{ fontSize:11, letterSpacing:3, textTransform:'uppercase', color:C.gold }}>Customer Account Ledger</div>
            <div style={{ fontSize:24, fontWeight:800, color:C.text }}>{customer.name}</div>
            <div style={{ fontSize:12, color:C.textMuted, marginTop:2 }}>GSTIN: <span style={{ color:C.blue, fontFamily:'monospace' }}>{customer.gst || 'None'}</span> {customer.phone && `• Phone: ${customer.phone}`}</div>
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button style={S.btn('whatsapp')} onClick={handleWhatsAppReminder}>💬 WhatsApp Reminder</button>
            <button style={S.btn('blue')} onClick={handlePrintStatement}>🖨 Print Statement</button>
            <button style={S.btn()} onClick={onClose}>✕ Close</button>
          </div>
        </div>

        {/* Financial KPIs */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:12, marginBottom:22 }}>
          <div style={S.card(C.blue)}>
            <div style={S.label}>Total Bills</div>
            <div style={{ fontSize:22, fontWeight:800, color:C.blue }}>{customerBills.length}</div>
          </div>
          <div style={S.card(C.gold)}>
            <div style={S.label}>Total Invoiced</div>
            <div style={{ fontSize:22, fontWeight:800, color:C.gold }}>{fmtINR(totalBilled)}</div>
          </div>
          <div style={S.card(C.green)}>
            <div style={S.label}>Total Received</div>
            <div style={{ fontSize:22, fontWeight:800, color:C.green }}>{fmtINR(totalPaid)}</div>
          </div>
          <div style={S.card(balanceDue>0?C.red:C.green)}>
            <div style={S.label}>Outstanding Balance</div>
            <div style={{ fontSize:22, fontWeight:800, color:balanceDue>0?C.red:C.green }}>{fmtINR(balanceDue)}</div>
          </div>
        </div>

        {/* Bills Table */}
        <div style={{ background:'rgba(255,255,255,0.02)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:12, overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background:'rgba(255,255,255,0.04)' }}>
                <th style={S.th}>Bill No</th>
                <th style={S.th}>Date</th>
                <th style={S.th}>Total Amount</th>
                <th style={S.th}>Paid</th>
                <th style={S.th}>Balance</th>
                <th style={S.th}>Status</th>
                <th style={S.th}>Actions</th>
              </tr>
            </thead>
            <tbody>
              {customerBills.map(b => {
                const fin = getBillFinancials(b);
                return (
                  <tr key={b.id}>
                    <td style={{ ...S.td, fontWeight:700, color:C.gold }}>#{b.billNo}</td>
                    <td style={{ ...S.td, color:C.textMuted }}>{b.date}</td>
                    <td style={{ ...S.td, fontWeight:700 }}>{fmtINR(b.netAmount)}</td>
                    <td style={{ ...S.td, color:C.green }}>{fmtINR(fin.totalPaid)}</td>
                    <td style={{ ...S.td, color:fin.balance>0?C.red:C.green, fontWeight:700 }}>{fmtINR(fin.balance)}</td>
                    <td style={S.td}>
                      <span style={S.badge(fin.computedStatus==='paid'?'green':fin.computedStatus==='partial'?'orange':'danger')}>
                        {fin.computedStatus}
                      </span>
                    </td>
                    <td style={S.td}>
                      <div style={{ display:'flex', gap:6 }}>
                        <button style={{ ...S.btn('blue'), padding:'4px 8px', fontSize:10 }} onClick={()=>api.printBill(generateBillHTML(b, company))}>🖨</button>
                        <button style={{ ...S.btn(), padding:'4px 8px', fontSize:10 }} onClick={()=>{ onClose(); onEditBill(b); }}>✎ Edit</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {customerBills.length === 0 && (
                <tr><td colSpan={7} style={{ ...S.td, textAlign:'center', color:C.textMuted, padding:30 }}>No bills for this customer</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── NEW & EDIT BILL FORM ──────────────────────────────────────────────────────
function NewBillForm({ customers, bills, countMap, onSave, editBill, onCancelEdit, driveConnected, company }) {
  const nextNo = editBill ? editBill.billNo : bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
  const [form, setForm]           = useState(editBill || { billNo:nextNo, date:today(), customer:'', partyGst:'', items:[{id:uid(),delNo:'',poNo:'',variety:'',count:'',kattu:'',kazhi:'',rate:'',amount:''}], status:'pending', payments:[] });
  const [saving, setSaving]       = useState(false);
  const [uploadStatus, setUpload] = useState(null); // null | 'uploading' | 'done' | 'error'
  const [driveUrl, setDriveUrl]   = useState(editBill?.driveUrl || null);
  const [errMsg, setErrMsg]       = useState('');
  const [billNoEdit, setBillNoEdit] = useState(false);

  useEffect(() => {
    if (editBill) {
      setForm(editBill);
      setDriveUrl(editBill.driveUrl || null);
    }
  }, [editBill]);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const handleCustomerSelect = (c) => setForm(f => ({ ...f, customer: c.name, partyGst: c.gst }));

  const setItem = (idx, k, v) => {
    const items = [...form.items];
    items[idx] = { ...items[idx], [k]: v };
    if (['kattu','kazhi','rate','count'].includes(k)) {
      const it = items[idx];
      const amt = calcAmount(it.kattu, it.kazhi, it.rate, it.count, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : '';
    }
    setForm(f => ({ ...f, items }));
  };

  const handleCountBlur = (idx) => {
    const it = form.items[idx];
    const formatted = autoFormatCount(it.count);
    if (formatted !== it.count) {
      const items = [...form.items];
      items[idx] = { ...items[idx], count: formatted };
      const amt = calcAmount(items[idx].kattu, items[idx].kazhi, items[idx].rate, formatted, countMap);
      items[idx].amount = amt > 0 ? fmt(amt) : items[idx].amount;
      setForm(f => ({ ...f, items }));
    }
  };

  const addRow    = () => setForm(f => ({ ...f, items: [...f.items, { id:uid(), delNo:'', poNo:'', variety:'', count:'', kattu:'', kazhi:'', rate:'', amount:'' }] }));
  const removeRow = (idx) => { if (form.items.length === 1) return; setForm(f => ({ ...f, items: f.items.filter((_,i)=>i!==idx) })); };
  const cloneRow  = (idx) => {
    const it = form.items[idx];
    setForm(f => ({ ...f, items: [...f.items, { ...it, id:uid() }] }));
  };

  const sub     = form.items.reduce((s, i) => s + Number(i.amount || 0), 0);
  const cgst    = sub * 0.025;
  const sgst    = sub * 0.025;
  const rawNet  = sub + cgst + sgst;
  const net     = Math.round(rawNet);
  const rounded = net - rawNet;

  const buildBillObject = () => ({
    ...form,
    billNo:    Number(form.billNo),
    subtotal:  sub,
    cgst,
    sgst,
    netAmount: net,
    id:        form.id || uid(),
    updatedAt: new Date().toISOString(),
  });

  const handleSave = async () => {
    if (!form.customer.trim()) { alert('Customer name required!'); return; }
    setSaving(true);
    setUpload('uploading');
    setErrMsg('');

    const bill = buildBillObject();
    await onSave(bill);

    const htmlContent = generateBillHTML(bill, company);

    if (driveConnected) {
      const result = await api.saveAndUploadBill({ billData: bill, htmlContent });
      if (result.success) {
        const billWithUrl = {
          ...bill,
          driveUrl: result.driveUrl,
          driveFileId: result.fileId,
          vaultFiles: result.vaultFiles,
          monthFolder: result.monthFolderName,
          monthFolderId: result.monthFolderId
        };
        await onSave(billWithUrl);
        setDriveUrl(result.driveUrl);
        setUpload('done');
      } else {
        setErrMsg(result.error || 'Drive upload failed');
        setUpload('error');
      }
    } else {
      setUpload('done');
    }

    setSaving(false);
  };

  const handleSaveLocalPdf = async () => {
    if (!form.customer.trim()) { alert('Customer name required!'); return; }
    const bill = buildBillObject();
    const htmlContent = generateBillHTML(bill, company);
    const res = await api.saveLocalPdf({ billData: bill, htmlContent });
    if (res.success) {
      alert('✅ PDF saved successfully!');
    }
  };

  const handlePrint = () => {
    const pb = buildBillObject();
    api.printBill(generateBillHTML(pb, company));
  };

  const handleWhatsApp = () => {
    const pb = buildBillObject();
    const matched = customers.find(c => c.name.toLowerCase() === form.customer.toLowerCase());
    const url = getWhatsAppShareUrl(pb, matched?.phone || '', driveUrl);
    api.openExternal(url);
  };

  const handleReset = () => {
    if (confirm('Clear form and start new bill?')) {
      if (onCancelEdit) onCancelEdit();
      const nNo = bills.length > 0 ? Math.max(...bills.map(b=>Number(b.billNo)||0))+1 : 1;
      setForm({ billNo:nNo, date:today(), customer:'', partyGst:'', items:[{id:uid(),delNo:'',poNo:'',variety:'',count:'',kattu:'',kazhi:'',rate:'',amount:''}], status:'pending', payments:[] });
      setDriveUrl(null);
      setUpload(null);
    }
  };

  const bi  = { background:'rgba(26,58,107,0.3)', border:'1px solid rgba(59,130,246,0.45)', borderRadius:6, padding:'7px 8px', color:'#e8f0ff', fontSize:12, width:'100%', fontFamily:'inherit', outline:'none', boxSizing:'border-box', textAlign:'center' };
  const biL = { ...bi, textAlign:'left' };

  return (
    <div className="fade-in">
      {/* Header bar */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:18, flexWrap:'wrap', gap:12 }}>
        <div>
          <div style={{ fontSize:10, letterSpacing:4, textTransform:'uppercase', color:C.gold }}>{company.name}</div>
          <div style={{ fontSize:24, fontWeight:800, color:C.text, display:'flex', alignItems:'center', gap:10 }}>
            {editBill ? '✏️ Edit Bill' : '➕ New Bill'} — <span style={{ color:C.blue }}>#{form.billNo}</span>
            {editBill && (
              <span style={{ fontSize:12, background:'rgba(255,170,68,0.2)', color:C.orange, border:'1px solid rgba(255,170,68,0.4)', borderRadius:6, padding:'2px 8px' }}>
                Editing Mode
              </span>
            )}
          </div>
        </div>

        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
          {editBill && (
            <button style={{ ...S.btn('danger'), padding:'8px 14px' }} onClick={onCancelEdit}>✕ Cancel Edit</button>
          )}
          {uploadStatus === 'uploading' && (
            <span style={{ fontSize:11, color:C.drive, display:'flex', alignItems:'center', gap:5 }}>
              <span style={{ display:'inline-block', animation:'spin 1s linear infinite' }}>⟳</span>
              PDF Sync to Drive...
            </span>
          )}
          {uploadStatus === 'done' && (
            <span onClick={()=>driveUrl ? api.openExternal(driveUrl) : null}
              style={{ fontSize:11, color:C.green, cursor:driveUrl?'pointer':'default', background:'rgba(78,217,122,0.12)', border:'1px solid rgba(78,217,122,0.4)', borderRadius:6, padding:'5px 10px' }}>
              {driveUrl ? '✅ PDF in Drive → Open ↗' : '✅ Bill Saved!'}
            </span>
          )}
          {uploadStatus === 'error' && (
            <span style={{ fontSize:11, color:C.red, background:'rgba(255,107,107,0.1)', border:'1px solid rgba(255,107,107,0.3)', borderRadius:6, padding:'5px 10px' }}>
              ⚠ {errMsg}
            </span>
          )}

          <button style={S.btn('whatsapp')} onClick={handleWhatsApp}>💬 WhatsApp</button>
          <button style={S.btn('blue')} onClick={handlePrint}>🖨 Print</button>
          <button style={S.btn()} onClick={handleSaveLocalPdf}>📥 Local PDF</button>
          <button style={S.btn('primary')} onClick={handleSave} disabled={saving}>
            {saving ? '⟳ Saving...' : '💾 Save Bill'}
          </button>
          <button style={{ ...S.btn(), padding:'8px 12px' }} onClick={handleReset} title="Start fresh bill">➕ Reset</button>
        </div>
      </div>

      {/* Bill form layout */}
      <div style={{ background:'linear-gradient(135deg,#0d1b3e 0%,#0f2447 50%,#0d1b3e 100%)', border:'2px solid #1e4d8c', borderRadius:16, boxShadow:'0 10px 50px rgba(13,27,62,0.6)', overflow:'hidden' }}>
        {/* Header section */}
        <div style={{ display:'flex', borderBottom:'2px solid #1e4d8c', flexWrap:'wrap' }}>
          <div style={{ flex:'1 1 60%', padding:'16px 20px', borderRight:'2px solid #1e4d8c' }}>
            <div style={{ fontSize:22, fontWeight:'bold', color:'#7bc8ff', letterSpacing:1, fontFamily:"'Times New Roman',serif", marginBottom:4 }}>{company.name}</div>
            <div style={{ fontSize:11.5, color:'#a0c4e8' }}>{company.address}</div>
            <div style={{ fontSize:11.5, color:'#a0c4e8' }}>{company.contact}</div>
            <div style={{ fontSize:11.5, color:'#7bc8ff', marginTop:3, fontWeight:600 }}>GSTIN : {company.gstin} &nbsp;&nbsp; HSN / SAC : {company.hsn}</div>
          </div>
          <div style={{ flex:'1 1 35%', padding:'14px 18px', minWidth:260 }}>
            <div style={{ textAlign:'center', background:'#1e4d8c', color:'#fff', fontWeight:'bold', fontSize:11.5, letterSpacing:2, padding:'6px 8px', borderRadius:4, marginBottom:10 }}>GST TAX INVOICE</div>
            <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'6px 10px', alignItems:'center' }}>
              <span style={{ fontSize:11, color:'#a0c4e8', fontWeight:'bold' }}>Bill No. :</span>
              {billNoEdit ? (
                <input style={{ ...bi, fontWeight:800, color:'#ffc84a', fontSize:16 }} type="number" value={form.billNo}
                  onChange={e=>set('billNo',e.target.value)} onBlur={()=>setBillNoEdit(false)} autoFocus />
              ) : (
                <div style={{ ...bi, fontWeight:800, color:'#ffc84a', fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }} onClick={()=>setBillNoEdit(true)}>
                  {form.billNo}<span style={{ fontSize:10, color:'rgba(160,196,232,0.6)' }}>✎</span>
                </div>
              )}
              <span style={{ fontSize:11, color:'#a0c4e8', fontWeight:'bold' }}>Date :</span>
              <input style={bi} type="date" value={form.date} onChange={e=>set('date',e.target.value)} />
            </div>
          </div>
        </div>

        <div style={{ textAlign:'center', background:'#1e4d8c', color:'#fff', fontWeight:'bold', letterSpacing:3, fontSize:12, padding:'6px', borderBottom:'2px solid #2563b0' }}>{company.title}</div>

        {/* Customer select */}
        <div style={{ padding:'12px 20px', borderBottom:'2px solid #1e4d8c' }}>
          <div style={{ display:'grid', gridTemplateColumns:'36px 1fr 90px 1fr', gap:'0 12px', alignItems:'center' }}>
            <span style={{ fontSize:12, color:'#a0c4e8', fontWeight:'bold' }}>M/s.</span>
            <AutocompleteInput
              value={form.customer}
              options={customers}
              onChange={v=>set('customer',v)}
              onSelect={handleCustomerSelect}
              placeholder="Search or type customer name..."
              style={biL}
              renderItem={(c) => (
                <div>
                  <div style={{ fontSize:13, color:'#e8f0ff', fontWeight:600 }}>{c.name}</div>
                  <div style={{ fontSize:10, color:'rgba(160,196,232,0.7)' }}>GST: {c.gst || 'None'}</div>
                </div>
              )}
            />
            <span style={{ fontSize:12, color:'#a0c4e8', fontWeight:'bold', textAlign:'right' }}>Party GST</span>
            <input style={biL} value={form.partyGst} onChange={e=>set('partyGst',e.target.value)} placeholder="Auto-filled or enter GST" />
          </div>
        </div>

        {/* Quick yarn variety chips */}
        <div style={{ padding:'6px 20px', background:'rgba(0,0,0,0.2)', borderBottom:'1px solid rgba(59,130,246,0.2)', display:'flex', gap:6, overflowX:'auto', alignItems:'center' }}>
          <span style={{ fontSize:10, color:'#7bc8ff', fontWeight:700, textTransform:'uppercase', letterSpacing:1, whiteSpace:'nowrap' }}>Common Counts:</span>
          {COMMON_COUNTS.slice(0, 7).map(c => (
            <span key={c} onClick={()=>{
              const lastIdx = form.items.length - 1;
              setItem(lastIdx, 'count', c);
            }} style={{ fontSize:10, background:'rgba(59,130,246,0.2)', border:'1px solid rgba(59,130,246,0.4)', borderRadius:4, padding:'2px 8px', color:'#a0c4e8', cursor:'pointer', whiteSpace:'nowrap' }}>
              {c}
            </span>
          ))}
        </div>

        {/* Items Table */}
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
            <thead>
              <tr style={{ background:'#1e4d8c' }}>
                {[['Sl','4%'],['Del. No.','10%'],['PO.No.','9%'],['Variety','22%'],['Count','9%'],['Kattu','7%'],['Kazhi','7%'],['Rate','9%'],['Amount','12%'],['','7%']].map(([h,w]) => (
                  <th key={h} style={{ padding:'8px 4px', color:'#e8f0ff', textAlign:'center', fontSize:10, letterSpacing:1.5, fontWeight:'bold', border:'1px solid rgba(255,255,255,0.15)', width:w }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {form.items.map((it, idx) => {
                const effDel       = getEffective(form.items, idx, 'delNo');
                const effPo        = getEffective(form.items, idx, 'poNo');
                const matchedCount = countMap.find(c => c.count.toLowerCase() === (it.count||'').toLowerCase());
                return (
                  <tr key={it.id} style={{ background:idx%2===0?'rgba(255,255,255,0.03)':'rgba(30,77,140,0.2)' }}>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'4px 3px', textAlign:'center', color:'#a0c4e8', fontSize:11 }}>{idx+1}</td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px', position:'relative' }}>
                      <input style={{ ...bi, padding:'5px 4px' }} value={it.delNo} onChange={e=>setItem(idx,'delNo',e.target.value)} />
                      {!it.delNo && idx>0 && effDel && <div style={{ position:'absolute', top:'50%', left:8, transform:'translateY(-50%)', fontSize:11, color:'rgba(160,196,232,0.4)', pointerEvents:'none', fontStyle:'italic' }}>{effDel}</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px', position:'relative' }}>
                      <input style={{ ...bi, padding:'5px 4px' }} value={it.poNo} onChange={e=>setItem(idx,'poNo',e.target.value)} />
                      {!it.poNo && idx>0 && effPo && <div style={{ position:'absolute', top:'50%', left:8, transform:'translateY(-50%)', fontSize:11, color:'rgba(160,196,232,0.4)', pointerEvents:'none', fontStyle:'italic' }}>{effPo}</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <AutocompleteInput
                        value={it.variety}
                        options={COMMON_VARIETIES}
                        onChange={v=>setItem(idx,'variety',v)}
                        onSelect={v=>setItem(idx,'variety',v)}
                        placeholder="Cotton, Viscose..."
                        style={{ ...bi, textAlign:'left', padding:'5px 6px' }}
                      />
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <input style={{ ...bi, padding:'5px 4px', borderColor:matchedCount?'rgba(78,217,122,0.6)':'rgba(59,130,246,0.45)' }}

                      {matchedCount
                        ? <div style={{ fontSize:9, color:'rgba(78,217,122,0.9)', textAlign:'center', marginTop:1 }}>={matchedCount.kazhi} kzh/ktt</div>
                        : it.count && <div style={{ fontSize:9, color:'rgba(255,168,30,0.8)', textAlign:'center', marginTop:1 }}>no map</div>}
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <input style={{ ...bi, padding:'5px 4px' }} value={it.kattu} onChange={e=>setItem(idx,'kattu',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <input style={{ ...bi, padding:'5px 4px' }} value={it.kazhi} onChange={e=>setItem(idx,'kazhi',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <input style={{ ...bi, padding:'5px 6px' }} value={it.rate} onChange={e=>setItem(idx,'rate',e.target.value)} />

                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', padding:'3px' }}>
                      <input style={{ ...bi, fontWeight:700, color:'#ffc84a', textAlign:'right', padding:'5px 6px' }} value={it.amount} onChange={e=>setItem(idx,'amount',e.target.value)} />
                    </td>
                    <td style={{ border:'1px solid rgba(59,130,246,0.2)', textAlign:'center' }}>
                      <div style={{ display:'flex', justifyContent:'center', gap:4 }}>
                        <button style={{ background:'none', border:'none', color:'#7bc8ff', cursor:'pointer', fontSize:12, padding:'0 3px' }} onClick={()=>cloneRow(idx)} title="Clone row">📋</button>
                        <button style={{ background:'none', border:'none', color:'rgba(255,107,107,0.7)', cursor:'pointer', fontSize:13, padding:'0 3px' }} onClick={()=>removeRow(idx)} title="Remove row">✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

              <span style={{ color:'#a0c4e8' }}> Only</span>

          <div style={{ flex:'1 1 40%', minWidth:260 }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}><tbody>
              {[['TOTAL',fmt(sub),false],['CGST  2.50 %',fmt(cgst),false],['SGST  2.50 %',fmt(sgst),false],['ROUNDED OFF',fmt(rounded),false],['NET AMOUNT',fmt(net),true]].map(([l,v,bold]) => (
                <tr key={l} style={{ background:bold?'#1e4d8c':'transparent' }}>
                  <td style={{ border:'1px solid rgba(59,130,246,0.25)', padding:'8px 14px', color:bold?'#fff':'#a0c4e8', fontWeight:bold?'bold':'normal', fontSize:bold?13:12 }}>{l}</td>
                  <td style={{ border:'1px solid rgba(59,130,246,0.25)', padding:'8px 14px', textAlign:'right', color:bold?'#ffc84a':'#e8f0ff', fontWeight:bold?'bold':'normal', fontSize:bold?15:12 }}>{v}</td>

              <tr><td colSpan={2} style={{ border:'1px solid rgba(59,130,246,0.25)', padding:'6px 14px', textAlign:'right', fontSize:10.5, color:'#7bc8ff', fontWeight:'bold', fontStyle:'italic' }}>For {company.name}</td></tr>

        <div style={{ padding:'8px 20px', borderTop:'1px solid #1e4d8c', fontSize:10.5, color:'#6a8ab0' }}>

  );

// ── BILLS LIST ────────────────────────────────────────────────────────────────
function BillsList({ bills, setBills, onEditBill, onCloneBill, customers, company }) {
  const [filter, setFilter]               = useState('all');
  const [dateFilter, setDateFilter]       = useState('all');
  const [selectedMonth, setSelectedMonth] = useState('all');
  const [search, setSearch]               = useState('');
  const [payModal, setPayModal]           = useState(null);
  const [syncingId, setSyncId]            = useState(null);
  const [organizingDrive, setOrganizing]  = useState(false);
  const [orgMessage, setOrgMessage]       = useState('');

  const confirmPaid = async (updatedPayments) => {
    const totalPaid = updatedPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
    const isFull = totalPaid >= payModal.netAmount;
    const u = bills.map(b => b.id === payModal.id ? {
      ...b,
      payments: updatedPayments,
      status: isFull ? 'paid' : (totalPaid > 0 ? 'partial' : 'pending'),
      paidDate: isFull ? (b.paidDate || today()) : null,
      receiptNo: isFull ? (b.receiptNo || `RCP-${b.billNo}`) : null,
    } : b);
    setBills(u);
    await api.storeSet('sgc-bills', u);
    setPayModal(null);
  };

  const del = async (id) => {
    if (!confirm('Are you sure you want to delete this bill?')) return;
    const u = bills.filter(b => b.id !== id);
    setBills(u);
    await api.storeSet('sgc-bills', u);
  };

  const resync = async (bill) => {
    setSyncId(bill.id);
    const result = await api.saveAndUploadBill({ billData: bill, htmlContent: generateBillHTML(bill, company) });
    if (result.success) {
      const u = bills.map(b => b.id === bill.id ? {
        ...b,
        driveUrl: result.driveUrl,
        driveFileId: result.fileId,
        vaultFiles: result.vaultFiles,
        monthFolder: result.monthFolderName || b.monthFolder,
        monthFolderId: result.monthFolderId || b.monthFolderId,
      } : b);
      setBills(u);
      await api.storeSet('sgc-bills', u);
    }
    setSyncId(null);
  };

  const handleDownloadCSV = async () => {
    const csvContent = exportBillsToCSV(list);
    const fileNameSuffix = selectedMonth !== 'all' ? `_${selectedMonth}` : `_${today()}`;
    await api.exportFile({
      defaultName: `SGC_Bills_Export${fileNameSuffix}.csv`,
      content: csvContent,
      extension: 'csv',
    });
  };

  const handleOrganizeDrive = async () => {
    setOrganizing(true);
    setOrgMessage('Organizing Drive folders...');
    try {
      const res = await api.organizeDriveBills();
      if (res.success) {
        setOrgMessage(`✅ Organized! Moved ${res.report?.moved || 0} bills, ${res.report?.alreadyInPlace || 0} already in month folders.`);
      } else {
        setOrgMessage(`⚠ ${res.error || 'Failed to organize'}`);
      }
    } catch (e) {
      setOrgMessage(`⚠ ${e.message}`);
    }
    setOrganizing(false);
    setTimeout(() => setOrgMessage(''), 5000);
  };

  // Month Folders Breakdown
  const monthFolders = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const ym = (b.date || '').slice(0, 7);
      if (!ym) return;
      if (!map[ym]) {
        const [y, m] = ym.split('-');
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const fullNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const mIdx = parseInt(m, 10) - 1;
        const label = `${monthNames[mIdx] || m} ${y}`;
        const folderName = `${y}-${m} (${fullNames[mIdx] || m} ${y})`;
        map[ym] = { key: ym, label, folderName, count: 0, total: 0, paid: 0, pending: 0 };
      }
      map[ym].count++;
      map[ym].total += Number(b.netAmount || 0);
      const fin = getBillFinancials(b);
      map[ym].paid += fin.totalPaid;
      map[ym].pending += fin.balance;
    });
    return Object.values(map).sort((a, b) => b.key.localeCompare(a.key));
  }, [bills]);

  // Filtering
  const now = new Date();
  const currentMonth = now.toISOString().slice(0, 7);
  const lastMonthObj = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lastMonth = lastMonthObj.toISOString().slice(0, 7);

  const list = bills.filter(b => {
    const fin = getBillFinancials(b);
    if (filter === 'paid'    && fin.computedStatus !== 'paid') return false;
    if (filter === 'pending' && fin.computedStatus !== 'pending') return false;
    if (filter === 'partial' && fin.computedStatus !== 'partial') return false;

    if (selectedMonth !== 'all' && (!b.date || !b.date.startsWith(selectedMonth))) return false;

    if (dateFilter === 'this-month' && (!b.date || !b.date.startsWith(currentMonth))) return false;
    if (dateFilter === 'last-month' && (!b.date || !b.date.startsWith(lastMonth))) return false;

    if (search) {
      const s = search.toLowerCase();
      const matchCustomer = (b.customer || '').toLowerCase().includes(s);
      const matchNo       = String(b.billNo || '').includes(s);
      const matchDel      = (b.items || []).some(it => (it.delNo || '').toLowerCase().includes(s));
      const matchPo       = (b.items || []).some(it => (it.poNo || '').toLowerCase().includes(s));
      if (!matchCustomer && !matchNo && !matchDel && !matchPo) return false;
    }
    return true;
  }).sort((a, b) => Number(b.billNo) - Number(a.billNo));

  const syncedCount  = bills.filter(b => b.driveUrl).length;
  const pendingCount = bills.filter(b => getBillFinancials(b).computedStatus === 'pending').length;
  const partialCount = bills.filter(b => getBillFinancials(b).computedStatus === 'partial').length;
  const paidCount    = bills.filter(b => getBillFinancials(b).computedStatus === 'paid').length;

  return (
    <div className="fade-in">
      {payModal && <PaymentModal bill={payModal} onConfirm={confirmPaid} onCancel={()=>setPayModal(null)} />}

      {/* Top Banner */}
      <div style={{ background:'rgba(52,168,83,0.08)', border:'1px solid rgba(52,168,83,0.3)', borderRadius:12, padding:'12px 18px', marginBottom:18, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
        <div style={{ fontSize:12, color:C.drive, fontWeight:600, display:'flex', alignItems:'center', gap:8 }}>
          <span>☁ {syncedCount} of {bills.length} bills backed up to Google Drive PDF (Month-Wise Folders)</span>
          {orgMessage && <span style={{ color:C.gold, fontSize:11, marginLeft:10 }}>{orgMessage}</span>}
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button style={{ ...S.btn('drive'), padding:'6px 12px', fontSize:10 }} onClick={handleOrganizeDrive} disabled={organizingDrive}>
            {organizingDrive ? '⟳ Organizing...' : '📁 Sync Month Folders'}
          </button>
          <button style={{ ...S.btn('success'), padding:'6px 14px', fontSize:10 }} onClick={handleDownloadCSV}>
            📊 Export Bills (Excel / CSV)
          </button>
        </div>
      </div>

      {/* Month Folders Selector Bar */}
      <div style={{ display:'flex', gap:8, overflowX:'auto', paddingBottom:8, marginBottom:16, alignItems:'center' }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.gold, display:'flex', alignItems:'center', gap:5, whiteSpace:'nowrap', marginRight:4 }}>
          <span>📁 MONTH FOLDERS:</span>
        </div>
        <button
          style={{
            ...S.btn(selectedMonth === 'all' ? 'primary' : ''),
            padding: '7px 14px',
            fontSize: 11,
            display: 'flex',
            alignItems: 'center',
            gap: 6,
            borderRadius: 8,
            whiteSpace: 'nowrap',
            fontWeight: selectedMonth === 'all' ? 700 : 500
          }}
          onClick={() => setSelectedMonth('all')}
        >
          <span>📁 All Months</span>
          <span style={{ background:'rgba(255,255,255,0.15)', borderRadius:10, padding:'1px 6px', fontSize:10 }}>{bills.length}</span>
        </button>
        {monthFolders.map(mf => (
          <button
            key={mf.key}
            style={{
              ...S.btn(selectedMonth === mf.key ? 'blue' : ''),
              background: selectedMonth === mf.key ? 'linear-gradient(135deg, #1e4d8c 0%, #2563eb 100%)' : 'rgba(255,255,255,0.04)',
              border: selectedMonth === mf.key ? '1px solid #60a5fa' : '1px solid rgba(255,255,255,0.08)',
              padding: '7px 14px',
              fontSize: 11,
              display: 'flex',
              alignItems: 'center',
              gap: 6,
              borderRadius: 8,
              whiteSpace: 'nowrap',
              color: selectedMonth === mf.key ? '#fff' : C.textMuted,
              fontWeight: selectedMonth === mf.key ? 700 : 500
            }}
            onClick={() => setSelectedMonth(mf.key)}
          >
            <span>📁 {mf.label}</span>
            <span style={{ background: selectedMonth === mf.key ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.08)', borderRadius:10, padding:'1px 6px', fontSize:10, color:'#fff' }}>
              {mf.count}
            </span>
          </button>
        ))}
      </div>

      {/* Active Month Folder Overview Card (when a month is selected) */}
      {selectedMonth !== 'all' && (() => {
        const curMf = monthFolders.find(m => m.key === selectedMonth);
        if (!curMf) return null;
        return (
          <div style={{
            background: 'linear-gradient(135deg, rgba(30,77,140,0.35) 0%, rgba(15,36,71,0.55) 100%)',
            border: '1px solid rgba(59,130,246,0.4)',
            borderRadius: 12,
            padding: '14px 18px',
            marginBottom: 18,
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            flexWrap: 'wrap',
            gap: 12
          }}>
            <div>
              <div style={{ fontSize: 10.5, color: '#93c5fd', fontWeight: 700, letterSpacing: 1.5, textTransform: 'uppercase' }}>
                📁 ALLOCATED GOOGLE DRIVE FOLDER:
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, color: '#fff', display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>
                <span>{curMf.folderName}</span>
                <span style={{ fontSize: 11, background: 'rgba(59,130,246,0.25)', color: '#93c5fd', padding: '2px 8px', borderRadius: 6 }}>
                  {curMf.count} Bills
                </span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Billed</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: C.text }}>{fmtINR(curMf.total)}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Collected</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: C.green }}>{fmtINR(curMf.paid)}</div>
              </div>
              <div>
                <div style={{ fontSize: 10, color: C.textMuted }}>Balance Due</div>
                <div style={{ fontSize: 14, fontWeight: 800, color: curMf.pending > 0 ? C.red : C.green }}>{fmtINR(curMf.pending)}</div>
              </div>
              <button
                style={{ ...S.btn('drive'), padding: '7px 12px', fontSize: 10, display: 'flex', alignItems: 'center', gap: 5 }}
                onClick={() => api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9')}
                title="Open Master Bills Vault in Google Drive"
              >
                ☁ Open in Drive ↗
              </button>
            </div>
          </div>
        );
      })()}

      {/* Filters bar */}
      <div style={{ display:'flex', gap:10, marginBottom:20, flexWrap:'wrap', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
          <input style={{ ...S.input, maxWidth:260 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search Bill No, Party, Del No..." />
          {[
            ['all', `All (${bills.length})`],
            ['pending', `Pending (${pendingCount})`],
            ['partial', `Partial (${partialCount})`],
            ['paid', `Paid (${paidCount})`],
          ].map(([v, l]) => (
            <button key={v} style={{ ...S.btn(filter===v?'primary':''), padding:'8px 12px' }} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>

        <div style={{ display:'flex', gap:6, alignItems:'center' }}>
          <span style={{ fontSize:11, color:C.textMuted }}>Period:</span>
          {[
            ['all', 'All Time'],
            ['this-month', 'This Month'],
            ['last-month', 'Last Month'],
          ].map(([v, l]) => (
            <button key={v} style={{ ...S.btn(dateFilter===v?'blue':''), padding:'6px 10px', fontSize:10 }} onClick={()=>setDateFilter(v)}>{l}</button>
          ))}
        </div>
      </div>

      {/* Bills Table */}
      <div style={S.section}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', minWidth:980, borderCollapse:'collapse' }}>
            <thead><tr>
              <th style={S.th}>Bill No</th>
              <th style={S.th}>Date</th>
              <th style={S.th}>Customer</th>
              <th style={S.th}>Net Amount</th>
              <th style={S.th}>Status</th>
              <th style={S.th}>Paid / Balance</th>
              <th style={{ ...S.th, color:C.drive }}>☁ Drive</th>
              <th style={{ ...S.th, textAlign:'right' }}>Actions</th>
            </tr></thead>
            <tbody>
              {list.map(b => {
                const fin = getBillFinancials(b);
                const matchedCust = customers.find(c => c.name.toLowerCase() === (b.customer||'').toLowerCase());
                return (
                  <tr key={b.id} style={{ opacity:fin.computedStatus==='paid'?0.8:1 }}>
                    <td style={{ ...S.td, fontWeight:800, color:C.gold }}>#{b.billNo}</td>
                    <td style={{ ...S.td, color:C.textMuted, fontSize:12 }}>
                      <div>{b.date}</div>
                      {b.monthFolder && (
                        <div style={{ fontSize:9, color:'#60a5fa', opacity:0.85, marginTop:2 }}>
                          📁 {b.monthFolder.split(' ')[0]}
                        </div>
                      )}
                    </td>
                    <td style={{ ...S.td, maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontWeight:600 }}>
                      {b.customer}
                    </td>
                    <td style={{ ...S.td, fontWeight:800, color:C.text }}>{fmtINR(b.netAmount)}</td>
                    <td style={S.td}>
                      <button onClick={()=>setPayModal(b)} style={{ background:'none', border:'none', cursor:'pointer', padding:0 }}>
                        <span style={S.badge(fin.computedStatus==='paid'?'green':fin.computedStatus==='partial'?'orange':'danger')}>
                          {fin.computedStatus==='paid'?'✓ Paid':fin.computedStatus==='partial'?'● Partial':'● Pending'}
                        </span>
                      </button>
                    </td>
                    <td style={{ ...S.td, fontSize:12 }}>
                      {fin.computedStatus==='paid' ? (
                        <span style={{ color:C.green }}>{fmtINR(fin.totalPaid)}</span>
                      ) : (
                        <div>
                          <div style={{ color:C.red, fontWeight:700 }}>Due: {fmtINR(fin.balance)}</div>
                          {fin.totalPaid > 0 && <div style={{ color:C.green, fontSize:10 }}>Paid: {fmtINR(fin.totalPaid)}</div>}
                        </div>
                      )}
                    </td>
                    <td style={S.td}>
                      {b.driveUrl ? (
                        <div>
                          <span onClick={()=>api.openExternal(b.driveUrl)}
                            style={{ color:C.drive, fontSize:11, cursor:'pointer', textDecoration:'underline', fontWeight:600 }}>☁ PDF Open</span>
                        </div>
                      ) : syncingId===b.id ? (
                        <span style={{ fontSize:11, color:C.drive }}>⟳ Uploading...</span>
                      ) : (
                        <button style={{ ...S.btn('drive'), padding:'4px 8px', fontSize:10 }} onClick={()=>resync(b)}>↑ Upload</button>
                      )}
                    </td>
                    <td style={{ ...S.td, textAlign:'right' }}>
                      <div style={{ display:'inline-flex', gap:5 }}>
                        <button style={{ ...S.btn('whatsapp'), padding:'5px 8px', fontSize:11 }} onClick={()=>api.openExternal(getWhatsAppShareUrl(b, matchedCust?.phone || ''))} title="Share on WhatsApp">💬</button>
                        <button style={{ ...S.btn('blue'), padding:'5px 8px', fontSize:11 }} onClick={()=>api.printBill(generateBillHTML(b, company))} title="Print Bill">🖨</button>
                        <button style={{ ...S.btn(), padding:'5px 8px', fontSize:11 }} onClick={()=>onEditBill(b)} title="Edit Bill">✎</button>
                        <button style={{ ...S.btn(), padding:'5px 8px', fontSize:11 }} onClick={()=>onCloneBill(b)} title="Clone Bill">📑</button>
                        <button style={{ ...S.btn('danger'), padding:'5px 8px', fontSize:11 }} onClick={()=>del(b.id)} title="Delete Bill">✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {list.length===0 && (
                <tr><td colSpan={8} style={{ ...S.td, textAlign:'center', color:C.textMuted, padding:40 }}>No bills match criteria</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── ANALYTICS & REPORTS PAGE ──────────────────────────────────────────────────
function AnalyticsPage({ bills, customers }) {
  const totalTurnover = bills.reduce((s,b)=>s+Number(b.netAmount||0),0);
  const totalCollected = bills.reduce((s,b)=>s+getBillFinancials(b).totalPaid,0);
  const totalDue = Math.max(0, totalTurnover - totalCollected);

  // Monthly breakdown
  const monthlyData = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const m = (b.date || '').slice(0, 7) || 'Other';
      if (!map[m]) map[m] = { month: m, billed: 0, collected: 0 };
      map[m].billed += Number(b.netAmount || 0);
      map[m].collected += getBillFinancials(b).totalPaid;
    });
    return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).slice(-8);
  }, [bills]);

  const maxMonthVal = Math.max(...monthlyData.map(m => Math.max(m.billed, m.collected)), 1000);

  // Top Customers
  const topCustomers = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const name = b.customer || 'Unknown';
      if (!map[name]) map[name] = { name, total: 0, count: 0, pending: 0 };
      map[name].total += Number(b.netAmount || 0);
      map[name].pending += getBillFinancials(b).balance;
      map[name].count += 1;
    });
    return Object.values(map).sort((a,b)=>b.total - a.total).slice(0, 6);
  }, [bills]);

  // Count distribution
  const countStats = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      (b.items || []).forEach(it => {
        const c = autoFormatCount(it.count) || 'Unspecified';
        if (!map[c]) map[c] = { count: c, kattu: 0, kazhi: 0, amount: 0 };
        map[c].kattu += Number(it.kattu || 0);
        map[c].kazhi += Number(it.kazhi || 0);
        map[c].amount += Number(it.amount || 0);
      });
    });
    return Object.values(map).sort((a,b)=>b.amount - a.amount).slice(0, 6);
  }, [bills]);

  return (
    <div className="fade-in">
      <div style={{ marginBottom:22 }}>
        <div style={{ fontSize:10, letterSpacing:4, textTransform:'uppercase', color:C.gold }}>Business Intelligence</div>
        <div style={{ fontSize:26, fontWeight:800, color:C.text }}>Financial Analytics & Insights</div>
      </div>

      {/* KPI Cards */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))', gap:14, marginBottom:26 }}>
        <div style={S.card(C.gold)}>
          <div style={S.label}>Total Turnover</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.gold }}>{fmtINR(totalTurnover)}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>{bills.length} total bills issued</div>
        </div>
        <div style={S.card(C.green)}>
          <div style={S.label}>Cash Realized</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.green }}>{fmtINR(totalCollected)}</div>
          <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>{totalTurnover>0?((totalCollected/totalTurnover)*100).toFixed(1):0}% collection rate</div>
        </div>
        <div style={S.card(C.red)}>
          <div style={S.label}>Market Outstanding Due</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.red }}>{fmtINR(totalDue)}</div>

// ── MONTHLY GST TAX FILING RADAR ──────────────────────────────────────────────
function MonthlyGSTRadar({ bills, company }) {
  const [copied, setCopied] = useState(false);

  // Determine current and previous month keys (YYYY-MM)
  const now = new Date();
  const currentMonthKey = now.toISOString().slice(0, 7);
  const prevMonthObj = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevMonthKey = prevMonthObj.toISOString().slice(0, 7);

  // Default to previous month if today is <= 20th of the month, else current month
  const [selectedMonth, setSelectedMonth] = useState(prevMonthKey);

  // Group all available months with GST data
  const monthData = useMemo(() => {
    const map = {};
    bills.forEach(b => {
      const ym = (b.date || '').slice(0, 7);
      if (!ym) return;
      if (!map[ym]) {
        const [y, m] = ym.split('-');
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const mIdx = parseInt(m, 10) - 1;
        const label = `${monthNames[mIdx] || m} ${y}`;
        map[ym] = {
          key: ym,
          label,
          subtotal: 0,
          cgst: 0,
          sgst: 0,
          totalGst: 0,
          gross: 0,
          count: 0,
          billNos: []
        };
      }
      map[ym].subtotal += Number(b.subtotal || 0);
      map[ym].cgst += Number(b.cgst || 0);
      map[ym].sgst += Number(b.sgst || 0);
      map[ym].gross += Number(b.netAmount || 0);
      map[ym].count += 1;
      if (b.billNo !== undefined && b.billNo !== null) map[ym].billNos.push(Number(b.billNo));
    });

    Object.values(map).forEach(m => {
      m.totalGst = m.cgst + m.sgst;
    });

    return map;
  }, [bills]);

  const availableMonths = useMemo(() => {
    const keys = Object.keys(monthData);
    if (!keys.includes(prevMonthKey)) keys.push(prevMonthKey);
    if (!keys.includes(currentMonthKey)) keys.push(currentMonthKey);
    return keys.sort().reverse();
  }, [monthData, prevMonthKey, currentMonthKey]);

  // Selected month stats
  const cur = monthData[selectedMonth] || {
    key: selectedMonth,
    label: selectedMonth,
    subtotal: 0,
    cgst: 0,
    sgst: 0,
    totalGst: 0,
    gross: 0,
    count: 0,
    billNos: []
  };

  const billRange = cur.billNos.length > 0
    ? `#${Math.min(...cur.billNos)} - #${Math.max(...cur.billNos)}`
    : 'None';

  const isPrev = selectedMonth === prevMonthKey;

  // Format message for CA / Auditor
  const auditorText = `Vanakkam Sir,
*${company.name}* — GST Tax Summary for GSTR Filing:
────────────────────────
📅 Period: ${cur.label} ${isPrev ? '(Previous Month Filing)' : ''}
🧾 Total Invoices: ${cur.count} Bills (${billRange})
💵 Taxable Subtotal: ${fmtINR(cur.subtotal)}

🔹 CGST (2.50%): ${fmtINR(cur.cgst)}
🔹 SGST (2.50%): ${fmtINR(cur.sgst)}
────────────────────────
🧾 TOTAL GST PAYABLE (5%): ${fmtINR(cur.totalGst)}
💰 Total Invoiced (Gross): ${fmtINR(cur.gross)}
────────────────────────
GSTIN: ${company.gstin}
Kindly file GSTR-3B / GSTR-1.`;

  const handleCopy = () => {
    navigator.clipboard.writeText(auditorText);
    setCopied(true);
    setTimeout(() => setCopied(false), 3000);
  };

  const handleWhatsApp = () => {
    const url = `https://wa.me/?text=${encodeURIComponent(auditorText)}`;
    api.openExternal(url);
  };

  const handleExportMonthCSV = async () => {
    const monthBills = bills.filter(b => (b.date || '').startsWith(selectedMonth));
    const csvContent = exportBillsToCSV(monthBills);
    await api.exportFile({
      defaultName: `SGC_GST_Report_${selectedMonth}.csv`,
      content: csvContent,
      extension: 'csv',
    });
  };

  return (
    <div style={{
      background: 'linear-gradient(135deg, rgba(26,58,107,0.35) 0%, rgba(13,27,62,0.85) 100%)',
      border: '1.5px solid rgba(59,130,246,0.45)',
      borderRadius: 16,
      padding: '20px 24px',
      marginBottom: 28,
      boxShadow: '0 8px 32px rgba(0,0,0,0.3)',
      position: 'relative',
      overflow: 'hidden'
    }}>
      {/* Decorative background glow */}
      <div style={{ position:'absolute', top:-40, right:-40, width:140, height:140, background:'rgba(59,130,246,0.15)', borderRadius:'50%', filter:'blur(40px)', pointerEvents:'none' }} />

      {/* Header with period switcher */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12, marginBottom:16 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
            <span style={{ fontSize:18 }}>🏛️</span>
            <span style={{ fontSize:16, fontWeight:800, color:'#fff', letterSpacing:0.5 }}>
              Monthly GST Tax Filing Radar
            </span>
            {isPrev && (
              <span style={{ fontSize:10, background:'rgba(255,170,68,0.2)', color:C.orange, border:'1px solid rgba(255,170,68,0.4)', borderRadius:6, padding:'2px 8px', fontWeight:700 }}>
                ⚡ Previous Month Filing
              </span>
            )}
            {now.getDate() <= 11 && isPrev && (
              <span style={{ fontSize:10, background:'rgba(239,68,68,0.2)', color:'#f87171', border:'1px solid rgba(239,68,68,0.4)', borderRadius:6, padding:'2px 8px', fontWeight:700 }}>
                🔔 Due for GSTR-1 & 3B
              </span>
            )}
          </div>
          <div style={{ fontSize:11.5, color:'#94a3b8', marginTop:3 }}>
            Auto-calculates CGST, SGST & Total Tax for before month and current month ready for your CA / Auditor.
          </div>
        </div>

        {/* Month Dropdown / Selector */}
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <span style={{ fontSize:11, color:C.textMuted }}>Period:</span>
          <select
            value={selectedMonth}
            onChange={e => setSelectedMonth(e.target.value)}
            style={{
              background: 'rgba(15,23,42,0.9)',
              border: '1px solid rgba(59,130,246,0.5)',
              borderRadius: 8,
              color: '#fff',
              padding: '6px 12px',
              fontSize: 12,
              fontWeight: 600,
              outline: 'none',
              cursor: 'pointer'
            }}
          >
            {availableMonths.map(ym => {
              const [y, m] = ym.split('-');
              const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
              const mIdx = parseInt(m, 10) - 1;
              const lbl = `${monthNames[mIdx] || m} ${y}`;
              const tag = ym === prevMonthKey ? ' (Previous Month)' : ym === currentMonthKey ? ' (Current Month)' : '';
              return (
                <option key={ym} value={ym} style={{ background: '#0f172a', color: '#fff' }}>
                  {lbl}{tag}

          </select>
        </div>
      </div>

      {/* Tax Metrics Grid */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(160px, 1fr))', gap:12, marginBottom:18 }}>
        {/* CGST */}
        <div style={{ background:'rgba(15,23,42,0.6)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 16px' }}>
          <div style={{ fontSize:10.5, color:'#94a3b8', textTransform:'uppercase', letterSpacing:1 }}>CGST (2.50%)</div>
          <div style={{ fontSize:20, fontWeight:800, color:'#60a5fa', marginTop:4 }}>{fmtINR(cur.cgst)}</div>
          <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>Central Tax</div>
        </div>

        {/* SGST */}
        <div style={{ background:'rgba(15,23,42,0.6)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 16px' }}>
          <div style={{ fontSize:10.5, color:'#94a3b8', textTransform:'uppercase', letterSpacing:1 }}>SGST (2.50%)</div>
          <div style={{ fontSize:20, fontWeight:800, color:'#38bdf8', marginTop:4 }}>{fmtINR(cur.sgst)}</div>
          <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>State Tax</div>
        </div>

        {/* TOTAL GST (HIGHLIGHTED) */}
        <div style={{
          background: 'linear-gradient(135deg, rgba(37,99,235,0.25) 0%, rgba(16,185,129,0.2) 100%)',
          border: '1.5px solid #10b981',
          borderRadius: 12,
          padding: '12px 16px',
          boxShadow: '0 0 20px rgba(16,185,129,0.15)'
        }}>
          <div style={{ fontSize:10.5, color:'#6ee7b7', textTransform:'uppercase', letterSpacing:1, fontWeight:700 }}>
            🧾 TOTAL GST (5.00%)
          </div>
          <div style={{ fontSize:22, fontWeight:900, color:'#10b981', marginTop:4 }}>{fmtINR(cur.totalGst)}</div>
          <div style={{ fontSize:10, color:'#a7f3d0', marginTop:2 }}>Total Tax Payable</div>
        </div>

        {/* Taxable Subtotal */}
        <div style={{ background:'rgba(15,23,42,0.6)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 16px' }}>
          <div style={{ fontSize:10.5, color:'#94a3b8', textTransform:'uppercase', letterSpacing:1 }}>Taxable Subtotal</div>
          <div style={{ fontSize:20, fontWeight:800, color:C.gold, marginTop:4 }}>{fmtINR(cur.subtotal)}</div>
          <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>Turnover without Tax</div>
        </div>

        {/* Total Invoiced (Gross) */}
        <div style={{ background:'rgba(15,23,42,0.6)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:'12px 16px' }}>
          <div style={{ fontSize:10.5, color:'#94a3b8', textTransform:'uppercase', letterSpacing:1 }}>Total Invoiced (Gross)</div>
          <div style={{ fontSize:20, fontWeight:800, color:'#f1f5f9', marginTop:4 }}>{fmtINR(cur.gross)}</div>
          <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>{cur.count} Invoices ({billRange})</div>
        </div>
      {/* Bill-by-Bill GST List for Selected Month */}
      <div style={{ marginTop: 18, marginBottom: 18, background: 'rgba(15,23,42,0.75)', borderRadius: 12, border: '1px solid rgba(255,255,255,0.08)', overflow: 'hidden' }}>
        <div style={{ padding: '12px 16px', background: 'rgba(255,255,255,0.03)', borderBottom: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: '#93c5fd', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span>🧾 Month-oda All Bills GST Breakdown</span> — <span style={{ color: '#fff' }}>{cur.label}</span>
          </div>

            style={{ ...S.btn(), padding:'7px 14px', fontSize:11, display:'flex', alignItems:'center', gap:6 }}

      </div>
    </div>
  );

    [fmtINR(pendingAmt), C.red,   'Pending Dues'],

          </tr></thead>
          <tbody>
            {[...bills].sort((a,b)=>Number(b.billNo)-Number(a.billNo)).slice(0,8).map(b => {
              const fin = getBillFinancials(b);
              const cust = customers.find(c=>c.name===b.customer);
              return (
                <tr key={b.id}>
                  <td style={{ ...S.td, color:C.gold, fontWeight:800 }}>#{b.billNo}</td>
                  <td style={{ ...S.td, color:C.textMuted, fontSize:12 }}>{b.date}</td>
                  <td style={{ ...S.td, fontWeight:600 }}>{b.customer}</td>
                  <td style={{ ...S.td, fontWeight:800 }}>{fmtINR(b.netAmount)}</td>
                  <td style={S.td}>
                    <span style={S.badge(fin.computedStatus==='paid'?'green':fin.computedStatus==='partial'?'orange':'danger')}>
                      {fin.computedStatus==='paid'?'✓ Paid':fin.computedStatus==='partial'?'● Partial':'● Pending'}
                    </span>
                  </td>
                  <td style={S.td}>
                    <div style={{ display:'flex', gap:6 }}>
                      <button style={{ ...S.btn('blue'), padding:'4px 8px', fontSize:10 }} onClick={()=>api.printBill(generateBillHTML(b, company))}>🖨 Print</button>
                      {cust && (
                        <button style={{ ...S.btn(), padding:'4px 8px', fontSize:10 }} onClick={()=>onShowLedger(cust)}>👤 Ledger</button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
            {bills.length===0 && <tr><td colSpan={6} style={{ ...S.td, textAlign:'center', color:C.textMuted, padding:40 }}>No bills yet</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── CUSTOMERS PAGE ────────────────────────────────────────────────────────────
function CustomersPage({ customers, bills, setCustomers, onShowLedger }) {
  const [nm, setNm]         = useState('');
  const [gst, setGst]       = useState('');
  const [phone, setPhone]   = useState('');
  const [search, setSearch] = useState('');

  const add = async () => {
    if (!nm.trim()) return;
    const u = [...customers, { id:uid(), name:nm.trim(), gst:gst.trim(), phone:phone.trim() }];
    setCustomers(u);
    await api.storeSet('sgc-customers', u);
    setNm(''); setGst(''); setPhone('');
  };

  const remove = async (id) => {
    if (!confirm('Are you sure you want to remove this customer?')) return;
    const u = customers.filter(c=>c.id!==id);
    setCustomers(u);
    await api.storeSet('sgc-customers', u);
  };

  const filtered = customers.filter(c =>
    !search ||
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    (c.gst && c.gst.toLowerCase().includes(search.toLowerCase())) ||
    (c.phone && c.phone.includes(search))
  );

  return (
    <div className="fade-in">
      <div style={S.section}>
        <div style={S.secTitle}>Add New Customer / Yarn Party</div>
        <div style={{ display:'grid', gridTemplateColumns:'1.5fr 1fr 1fr auto', gap:12, alignItems:'flex-end' }}>
          <div><label style={S.label}>Party / Mill Name</label><input style={S.input} value={nm} onChange={e=>setNm(e.target.value)} placeholder="e.g. Unity Exports" /></div>
          <div><label style={S.label}>GST Number</label><input style={S.input} value={gst} onChange={e=>setGst(e.target.value)} placeholder="33XXXXX..." /></div>
          <div><label style={S.label}>Phone Number</label><input style={S.input} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="98XXXXXXXX" /></div>
          <button style={S.btn('primary')} onClick={add}>+ Add Customer</button>
        </div>
      </div>

      <div style={S.section}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10 }}>
          <div style={S.secTitle}>All Customers ({customers.length})</div>
          <input style={{ ...S.input, maxWidth:260 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search Party or GST..." />
        </div>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead><tr>
            <th style={S.th}>#</th>
            <th style={S.th}>Party Name</th>
            <th style={S.th}>GST Number</th>
            <th style={S.th}>Phone</th>
            <th style={S.th}>Total Bills</th>
            <th style={S.th}>Outstanding</th>
            <th style={{ ...S.th, textAlign:'right' }}>Actions</th>
          </tr></thead>
          <tbody>
            {filtered.map((c, i) => {
              const cb = bills.filter(b=>b.customer===c.name);
              const due = cb.reduce((s,b)=>s+getBillFinancials(b).balance, 0);
              return (
                <tr key={c.id}>
                  <td style={{ ...S.td, color:C.textMuted, fontSize:11 }}>{i+1}</td>
                  <td style={{ ...S.td, fontWeight:700, color:C.gold }}>{c.name}</td>
                  <td style={{ ...S.td, fontSize:11, color:C.textMuted, fontFamily:'monospace' }}>{c.gst||'—'}</td>
                  <td style={{ ...S.td, fontSize:12, color:C.blue }}>{c.phone||'—'}</td>
                  <td style={S.td}><span style={S.badge(cb.length>0?'blue':'orange')}>{cb.length} bills</span></td>
                  <td style={{ ...S.td, fontWeight:700, color:due>0?C.red:C.green }}>{fmtINR(due)}</td>
                  <td style={{ ...S.td, textAlign:'right' }}>
                    <div style={{ display:'inline-flex', gap:6 }}>
                      <button style={{ ...S.btn('blue'), padding:'4px 10px', fontSize:10 }} onClick={()=>onShowLedger(c)}>👤 Statement / Ledger</button>
                      <button style={{ ...S.btn('danger'), padding:'4px 10px', fontSize:10 }} onClick={()=>remove(c.id)}>✕</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── SETTINGS PAGE ─────────────────────────────────────────────────────────────
function SettingsPage({ countMap, setCountMap, driveConnected, onDriveConnect, onDriveDisconnect, folderId, setFolderId, company, setCompany, bills, setBills, customers, setCustomers, syncingAll, syncAllBills }) {
  const [newCount, setNewCount]     = useState('');
  const [newKazhi, setNewKazhi]     = useState('');
  const [cmMsg, setCmMsg]           = useState('');
  const [folderEdit, setFolderEdit] = useState(folderId);
  const [compEdit, setCompEdit]     = useState(company || DEFAULT_COMPANY);
  const [backupMsg, setBackupMsg]   = useState('');

  const addCount = async () => {
    if (!newCount.trim() || !newKazhi) return;
    const formatted = autoFormatCount(newCount.trim());
    const u = [...countMap, { id:uid(), count:formatted, kazhi:Number(newKazhi) }];
    setCountMap(u);
    await api.storeSet('sgc-countmap', u);
    setNewCount(''); setNewKazhi('');
    setCmMsg(`✓ Added ${formatted}`);
    setTimeout(()=>setCmMsg(''), 2000);
  };

  const removeCount = async (id) => {
    const u = countMap.filter(c=>c.id!==id);
    setCountMap(u);
    await api.storeSet('sgc-countmap', u);
  };

  const saveFolderId = async () => {
    await api.storeSet('drive-folder-id', folderEdit);
    setFolderId(folderEdit);
    alert('Folder ID saved!');
  };

  const saveCompanyProfile = async () => {
    await api.storeSet('sgc-company-profile', compEdit);
    setCompany(compEdit);
    alert('Company details updated successfully!');
  };

  const handleBackupDownload = async () => {
    const backupData = {
      version: '5.0',
      exportedAt: new Date().toISOString(),
      bills,
      customers,
      countMap,
      company: compEdit,
      folderId,
    };
    const content = JSON.stringify(backupData, null, 2);
    const res = await api.exportFile({
      defaultName: `SGC_Billing_Full_Backup_${today()}.json`,
      content,
      extension: 'json',
    });
    if (res.success) {
      setBackupMsg('✅ Backup downloaded successfully!');
      setTimeout(()=>setBackupMsg(''), 3000);
    }
  };

  const handleRestoreBackup = async () => {
    const res = await api.importFile();
    if (res.success && res.data) {
      const data = res.data;
      if (!data.bills || !Array.isArray(data.bills)) {
        alert('Invalid backup file structure!');
        return;
      }
      if (confirm(`Restore ${data.bills.length} bills and ${data.customers?.length || 0} customers from backup? This will update your system.`)) {
        if (data.bills)     { setBills(data.bills); await api.storeSet('sgc-bills', data.bills); }
        if (data.customers) { setCustomers(data.customers); await api.storeSet('sgc-customers', data.customers); }
        if (data.countMap)  { setCountMap(data.countMap); await api.storeSet('sgc-countmap', data.countMap); }
        if (data.company)   { setCompany(data.company); setCompEdit(data.company); await api.storeSet('sgc-company-profile', data.company); }
        alert('✅ Data restored successfully!');
      }
    }
  };

  return (
    <div className="fade-in">
      {/* Drive Connection */}
      <div style={{ ...S.section, borderColor:driveConnected?'rgba(52,168,83,0.4)':'rgba(255,107,107,0.3)' }}>
        <div style={{ ...S.secTitle, color:driveConnected?C.drive:C.red }}>Google Drive PDF Auto-Backup</div>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
          <div>
            <div style={{ fontSize:14, color:driveConnected?C.green:C.red, fontWeight:700, marginBottom:4 }}>
              {driveConnected ? '✅ Drive Connected — Automatic PDF upload is active' : '❌ Drive Offline — Connect for Google Drive sync'}
            </div>
            <div style={{ fontSize:11, color:C.textMuted }}>
              When connected, bills are automatically converted to PDF and saved to your Google Drive folder.
            </div>
          </div>
          {driveConnected ? (
            <button style={S.btn('danger')} onClick={onDriveDisconnect}>Disconnect Drive</button>
          ) : (
            <button style={S.btn('drive')} onClick={onDriveConnect}>Connect Drive →</button>
          )}
        </div>
        {driveConnected && (
          <div style={{ marginTop:16, display:'flex', gap:10, alignItems:'flex-end', flexWrap:'wrap' }}>
            <div style={{ flex:1, minWidth:240 }}>
              <label style={S.label}>Master Main Bills Google Drive Folder ID (Locked)</label>
              <input style={S.input} value={folderEdit} onChange={e=>setFolderEdit(e.target.value)} />
            </div>
            <button style={S.btn('success')} onClick={saveFolderId}>Save Folder ID</button>
            <button
              style={{ ...S.btn('drive'), padding:'8px 14px' }}
              onClick={()=>api.openExternal('https://drive.google.com/drive/folders/11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9?usp=drive_link')}>
              📂 Open Main Drive Folder ↗
            </button>
            <button style={{ ...S.btn('primary'), padding:'8px 14px' }} onClick={syncAllBills} disabled={syncingAll}>
              {syncingAll ? '⟳ Syncing...' : '☁ Sync All Bills'}
            </button>
          </div>
        )}
        {driveConnected && (
          <div style={{ marginTop:12, fontSize:11, color:C.textMuted }}>
            Mukil's Master Main Bills Drive Vault: <b>11KMBP0HHa2AFl30zjL8-a_-BQk9MgWM9</b>. Every bill PDF is automatically uploaded directly to this folder.
          </div>
        )}
      </div>

      {/* Backup & Restore */}
      <div style={S.section}>
        <div style={S.secTitle}>🛡️ System Data Backup & Restore</div>
        <p style={{ fontSize:12, color:C.textMuted, marginBottom:16 }}>
          Export all your billing records, customer directories, and configurations into a single JSON file. You can restore it anytime on any computer.
        </p>
        <div style={{ display:'flex', gap:12, flexWrap:'wrap', alignItems:'center' }}>
          <button style={S.btn('primary')} onClick={handleBackupDownload}>📥 Download Full Backup (.json)</button>
          <button style={S.btn('blue')} onClick={handleRestoreBackup}>📤 Restore Backup File</button>
          {backupMsg && <span style={{ fontSize:12, color:C.green, fontWeight:700 }}>{backupMsg}</span>}
        </div>
      </div>

      {/* Count Map */}
      <div style={S.section}>
        <div style={S.secTitle}>Count → Kazhi Calculation Mapping</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:10, alignItems:'flex-end', marginBottom:16 }}>
          <div><label style={S.label}>Yarn Count (e.g. 17s)</label><input style={S.input} value={newCount} onChange={e=>setNewCount(e.target.value)} placeholder="17s" /></div>
          <div><label style={S.label}>Kazhi per Kattu</label><input style={S.input} type="number" value={newKazhi} onChange={e=>setNewKazhi(e.target.value)} placeholder="17" /></div>
          <button style={S.btn('primary')} onClick={addCount}>+ Add Mapping</button>
        </div>
        {cmMsg && <div style={{ fontSize:12, color:C.green, marginBottom:10 }}>{cmMsg}</div>}
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead><tr><th style={S.th}>Count</th><th style={S.th}>Kazhi per Kattu</th><th style={{ ...S.th, textAlign:'right' }}>Action</th></tr></thead>
          <tbody>
            {countMap.map(cm=>(
              <tr key={cm.id}>
                <td style={{ ...S.td, fontWeight:800, color:C.gold }}>{cm.count}</td>
                <td style={S.td}>{cm.kazhi}</td>

              </tr>
